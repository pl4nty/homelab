# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ataxx${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      tolerations:
      - key: topology.kubernetes.io/region
        operator: Exists
        effect: PreferNoSchedule
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/ataxx
              tag: ${APP_IMAGE_TAG:=}
            # ataxx doesn't have a "new game" button, so we just restart it regularly
            command:
              - bash
              - -c
              - while :; do timeout 300 cabal v2-run game -- "$@"; done
              - --
            args:
              - --p1
              - human
              - --p2
              - ai
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - ataxx${APP_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 3000
