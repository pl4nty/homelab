# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      tolerations:
      - key: topology.kubernetes.io/region
        operator: Exists
        effect: PreferNoSchedule
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        # no OTel java agent: on cluster-1 the operator mounts it at /otel-auto-instrumentation-java-main but
        # points -javaagent at /otel-auto-instrumentation-java, so the JVM exits at startup
        containers:
          main:
            image:
              repository: ghcr.io/stirling-tools/s-pdf
              tag: 3.4.0@sha256:972ffc10fbd63a9e7178253a49050c7658e0d4e03b2701005c3e12e210d2e068
            env:
              SYSTEM_ENABLEANALYTICS: false
              # upstream settings.yml defaults security.enableLogin to true; this is a public tool
              SECURITY_ENABLELOGIN: false
            # the java agent and PDF temp files outgrow cluster-1's 100Mi ephemeral-storage default (system/limitrange.yaml)
            resources:
              requests:
                ephemeral-storage: 256Mi
              limits:
                ephemeral-storage: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - pdf${APP_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
