# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: msft-updates${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        # RWO volumes can't attach to two nodes during a rollout
        strategy: Recreate
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-dotnet: "true"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/msft-updates
              tag: ${APP_IMAGE_TAG:=}
            env:
              # previews sync a sample instead of the whole catalog
              Sync__Full: "${APP_RETAIN:=true}"
              # a full sync peaks at 3.6 GB with this heap cap; DuckDB and cabextract need the rest
              DOTNET_GCHeapHardLimit: "0x80000000"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 5Gi
          ui:
            image:
              repository: ghcr.io/caioricciuti/duck-ui
              tag: 2.4.0@sha256:682d3edab619137bd42d0e8ba1a066152661a12da25af4afa9c23d0464e4b287
            env:
              DUCK_UI_EXTERNAL_CONNECTION_NAME: msft-updates
              DUCK_UI_EXTERNAL_HOST: https://msft-updates${APP_SUFFIX:=}.${PUBLIC_DOMAIN}/query
              DUCK_UI_EXTERNAL_PORT: "443"
              DUCK_UI_EXTERNAL_DATABASE_NAME: memory
            securityContext:
              # the image's user, which owns the served files. Its entrypoint writes env.js there
              runAsUser: 1001
              runAsGroup: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # Duck-UI has no branding settings, so nginx swaps the title and icon and adds the tplant stylesheet
          nginx:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine-slim@sha256:a8cb0f33d51fa107c96fd2bd3a71aaf564ec131e9d2bdf8700944f0ed8b170d7
            probes:
              liveness: &nginx-probe
                enabled: true
                type: HTTP
                path: /tplant.css
                port: 8081
              readiness: *nginx-probe
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
                ephemeral-storage: 64Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
          web:
            port: 8081
    persistence:
      data:
        # keep data if a failed install is remediated by uninstalling. previews drop theirs
        retain: ${APP_RETAIN:=true}
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          main:
            main:
              - path: /data
      # cabextract input and DuckDB spill files
      tmp:
        type: emptyDir
        sizeLimit: 4Gi
        advancedMounts:
          main:
            main:
              - path: /tmp
      # Duck-UI's kiosk mode (only this catalog, no connection or import panels) and its branding
      ui:
        type: configMap
        identifier: ui
        advancedMounts:
          main:
            ui:
              - path: /app/dist/databases/manifest.json
                subPath: manifest.json
                readOnly: true
            nginx:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
              - path: /usr/share/nginx/html/tplant.css
                subPath: tplant.css
                readOnly: true
              - path: /usr/share/nginx/html/favicon.svg
                subPath: favicon.svg
                readOnly: true
    configMaps:
      ui:
        data:
          manifest.json: |
            {"databases": [], "ui": {"kiosk": true}}
          default.conf: |
            server {
              listen 8081;

              location ~ ^/(tplant\.css|favicon\.svg)$ {
                root /usr/share/nginx/html;
                expires 1h;
              }

              location / {
                proxy_pass http://127.0.0.1:5522;
                # sub_filter can't rewrite compressed responses
                proxy_set_header Accept-Encoding "";
                # Duck-UI's policy, with the fonts' CDN and Zaraz's Faro SDK allowed
                proxy_hide_header Content-Security-Policy;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https: http: data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
                sub_filter '<title>Duck-UI: DuckDB in your browser</title>' '<title>msft-updates</title>';
                sub_filter '<link rel="icon" type="image/png" href="/logo-padding.png" />' '<link rel="icon" type="image/svg+xml" href="/favicon.svg" />';
                sub_filter '</head>' '<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="/tplant.css"></head>';
                sub_filter_once on;
              }
            }
          favicon.svg: |
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#2e7d32"/><ellipse cx="16" cy="9" rx="8" ry="3" fill="#c8e6c9"/><path d="M8 9v14c0 1.7 3.6 3 8 3s8-1.3 8-3V9" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 12v9m-3.5-3.5L16 21l3.5-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          tplant.css: |
            /* tplant.com.au design tokens (pl4nty/garden) over Duck-UI's colour variables */
            /* fontsource's @font-face rules, inlined: @import would block rendering on two more requests */
            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 400;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-400-normal.woff2') format('woff2');
              unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
            }

            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 400;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-ext-400-normal.woff2') format('woff2');
              unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
            }

            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 600;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-600-normal.woff2') format('woff2');
              unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
            }

            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 600;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-ext-600-normal.woff2') format('woff2');
              unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
            }

            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 700;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-700-normal.woff2') format('woff2');
              unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
            }

            @font-face {
              font-family: 'Titillium Web';
              font-style: normal;
              font-display: swap;
              font-weight: 700;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/titillium-web@5.3.0/files/titillium-web-latin-ext-700-normal.woff2') format('woff2');
              unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
            }

            @font-face {
              font-family: 'Fira Code';
              font-style: normal;
              font-display: swap;
              font-weight: 400;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.3.0/files/fira-code-latin-400-normal.woff2') format('woff2');
              unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
            }

            @font-face {
              font-family: 'Fira Code';
              font-style: normal;
              font-display: swap;
              font-weight: 400;
              src: url('https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.3.0/files/fira-code-latin-ext-400-normal.woff2') format('woff2');
              unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
            }

            html:root {
              --font-sans: 'Titillium Web', system-ui, sans-serif;
              --font-mono: 'Fira Code', ui-monospace, monospace;
              --radius: 5px;
              --canvas: #f8f8f8;
              --sidebar: #efefef;
              --surface: #fff;
              --surface-2: #f8f8f8;
              --elevated: #fff;
              --fg: #303030;
              --fg-2: #4a4a4a;
              --fg-3: #666;
              --fg-4: #b0b0b0;
              --accent: #2e7d32;
              --accent-fg: #fff;
              --accent-soft: #2e7d3224;
              --accent-ring: #2e7d3280;
            }

            html.dark {
              --canvas: #141414;
              --sidebar: #141414;
              --surface: #1f1f1f;
              --surface-2: #262826;
              --elevated: #1f1f1f;
              --fg: #e0f0e9;
              --fg-2: #c5d3cc;
              --fg-3: #a9a9a9;
              --fg-4: #7a8882;
              --accent: #66bb6a;
              --accent-fg: #141414;
              --accent-soft: #66bb6a24;
              --accent-ring: #66bb6a80;
            }

            a {
              font-weight: 600;
            }
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - msft-updates${APP_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          # the Cloudflare gateway passes paths to the tunnel as regexes and ignores other matches
          - matches:
              - path:
                  type: RegularExpression
                  value: ^/(query|files|status)(/|$)
            backendRefs:
              - identifier: main
                port: 8080
          - backendRefs:
              - identifier: main
                port: 8081
