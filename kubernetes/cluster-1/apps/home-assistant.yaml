# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-python: "true"
            instrumentation.opentelemetry.io/otel-python-platform: musl
          nodeSelector:
            node.longhorn.io/create-default-disk: config
        # a Deployment, not a StatefulSet: an OrderedReady StatefulSet never replaces a
        # crash-looping pod, so a broken release stays broken after the fix merges.
        # Recreate because the RWO volume can't attach to two pods during a rollout
        strategy: Recreate
        containers:
          main:
            image: &image
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
            env:
              # the recorder writes every state change to SQLite, which would flood the traces.
              # 2026.11 aliases httpx to httpx2 on startup and exits if httpx is already imported.
              # the httpx instrumentor (entry points httpx, httpx2) imports it, and so does the
              # botocore one (entry points botocore, aiobotocore) through aiobotocore
              OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: sqlite3,sqlalchemy,httpx,httpx2,botocore,aiobotocore
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
        initContainers:
          # a new volume, as in previews, starts with the proxy settings prod has, or HA answers 400 behind the gateway.
          # http settings in configuration.yaml only become a trial that reverts after five minutes
          config:
            image: *image
            command:
              - sh
              - -c
              - |
                [ -e /config/.storage/http ] && exit
                mkdir -p /config/.storage
                cat > /config/.storage/http <<EOF
                {
                  "version": 3,
                  "minor_version": 1,
                  "key": "http",
                  "data": {
                    "stable": {
                      "server_port": 8123,
                      "use_x_forwarded_for": true,
                      "trusted_proxies": ["10.0.0.0/16", "10.244.0.0/16"],
                      "cors_allowed_origins": ["https://cast.home-assistant.io"],
                      "login_attempts_threshold": -1,
                      "ip_ban_enabled": true,
                      "ssl_profile": "intermediate_v6",
                      "use_x_frame_options": true,
                      "created_at": "2026-11-17T00:00:00+00:00",
                      "error": null,
                      "error_message": null
                    },
                    "pending": null,
                    "yaml_migration_done": true
                  }
                }
                EOF
    persistence:
      config:
        retain: ${APP_RETAIN:=true}
        accessMode: ReadWriteOnce
        size: 4Gi
        globalMounts:
          - path: /config
    service:
      main:
        controller: main
        ports:
          http:
            port: 8123
      local:
        enabled: true
        controller: main
        type: LoadBalancer
        annotations:
          external-mdns.blakecovarrubias.com/hostnames: homeassistant${APP_SUFFIX:=}
        ports:
          http:
            port: 8123
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - home-assistant${APP_SUFFIX:=}.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 8123
