# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app searxng
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # keep off the 8GiB amd64 control plane node
      nodeSelector:
        kubernetes.io/arch: arm64
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/searxng/searxng
              tag: latest@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
            # the image user. the entrypoint only needs root to chown volumes
            securityContext:
              runAsUser: 977
              runAsGroup: 977
              runAsNonRoot: true
            env:
              SEARXNG_BASE_URL: https://search.${PRIVATE_DOMAIN}/
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                path: /healthz
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
                ephemeral-storage: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - search.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
