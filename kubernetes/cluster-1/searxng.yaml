# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app searxng
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # keep off the 8GiB amd64 control plane node
      nodeSelector:
        kubernetes.io/arch: arm64
    controllers:
      main:
        # a native sidecar starts first, so the limiter finds Valkey at startup
        # instead of switching itself off
        initContainers:
          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
            restartPolicy: Always
            # limiter counters only, so nothing to persist
            args: [--save, "", --appendonly, "no", --maxmemory, 32mb, --maxmemory-policy, allkeys-lru]
            probes:
              startup:
                enabled: true
                command: [valkey-cli, ping]
                spec:
                  periodSeconds: 1
                  failureThreshold: 30
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          main:
            image:
              repository: ghcr.io/searxng/searxng
              tag: latest@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7
            # the image user. the entrypoint only needs root to chown volumes
            securityContext:
              runAsUser: 977
              runAsGroup: 977
              runAsNonRoot: true
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /healthz
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                path: /healthz
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
                ephemeral-storage: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          main:
            main:
              # the entrypoint copies the template to /etc/searxng/settings.yml and
              # swaps ultrasecretkey for a random key on every start
              - path: /usr/local/searxng/settings.template.yml
                subPath: settings.yml
                readOnly: true
              - path: /etc/searxng/limiter.toml
                subPath: limiter.toml
                readOnly: true
    configMaps:
      config:
        data:
          settings.yml: |
            use_default_settings: true
            server:
              base_url: https://search.${PUBLIC_DOMAIN}/
              # the key only signs image proxy links and hashes cache and Valkey keys,
              # which all live as long as the pod
              secret_key: ultrasecretkey
              limiter: true
              default_http_headers:
                # the zone caches everything at the edge, results included
                Cloudflare-CDN-Cache-Control: no-store
            valkey:
              url: valkey://localhost:6379/0
          limiter.toml: |
            [botdetection]
            # requests arrive from cloudflared pods, and Cloudflare appends the client
            # IP to X-Forwarded-For
            trusted_proxies = ['10.244.0.0/16']
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - search.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
