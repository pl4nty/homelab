# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Network UPS Tools server for the Eaton 3S 850. After 30 minutes on battery, or on low battery,
# this primary upsmon tells every home node's nut-client extension (talos/hardware/home.yaml) to
# power off. Once they have logged out it schedules the UPS to cut then restore its outlets, so the
# router stays up and the nodes boot again when mains returns
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nut
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # the UPS USB cable is in the Turing Pi's rear ports, which only slot 4 drives
      nodeSelector:
        kubernetes.io/hostname: talos-uj3-t5w
      # the node clients reach upsd at 192.168.1.134 without kube-proxy, which stops before they do
      hostNetwork: true
    controllers:
      nut:
        # Talos skips DaemonSet pods when it drains a node, so this outlives uj3's own client
        # long enough to send shutdown.return
        type: daemonset
        containers:
          driver:
            image: &image
              repository: instantlinux/nut-upsd
              tag: 2.8.5-r1@sha256:a186d74a586ec4e10494270f6a52e26bb5e50663d2f8570865f5bd38273e096e
            command: [/usr/lib/nut/usbhid-ups, -a, eaton, -F, -u, root]
            # restarts the driver when its data goes stale, e.g. after a USB glitch
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [upsc, eaton@localhost, ups.status]
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 4
            securityContext:
              # raw USB access to a device that can be replugged under a new path
              privileged: true
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
          upsd:
            image: *image
            command: [/usr/sbin/upsd, -F, -u, root]
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                # both call initgroups even when staying root
                add: [SETUID, SETGID]
            resources: &resources
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
          upsmon:
            image: *image
            command: [/usr/sbin/upsmon, -F]
            securityContext: *securityContext
            resources: *resources
          exporter:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
            args:
              - --nut.vars_enable=battery.charge,battery.runtime,input.voltage,ups.load,ups.status
              - --nut.statuses=OL,OB,LB,RB,CHRG,DISCHRG,BYPASS,OVER,FSD
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65534
              readOnlyRootFilesystem: true
            resources: *resources
    service:
      nut:
        controller: nut
        ports:
          metrics:
            port: 9199
    serviceMonitor:
      nut:
        service:
          identifier: nut
        endpoints:
          - port: metrics
            path: /ups_metrics
            params:
              ups: [eaton]
    persistence:
      # the passwords are in nut.sops.yaml
      config:
        type: projected
        sources:
          - configMap:
              name: nut
          - secret:
              name: nut
        advancedMounts:
          nut:
            driver: &config
              - path: /etc/nut
                readOnly: true
            upsd: *config
            upsmon: *config
      run:
        type: emptyDir
        advancedMounts:
          nut:
            driver: &run
              - path: /run/nut
            upsd: *run
            upsmon: *run
      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        advancedMounts:
          nut:
            driver:
              - path: /dev/bus/usb
    configMaps:
      config:
        data:
          ups.conf: |
            [eaton]
              driver = usbhid-ups
              port = auto
              vendorid = 0463
              # NUT decides low battery from these instead of the UPS's own, much lower, threshold.
              # A backstop for the upssched timer, low enough not to beat it at today's load
              ignorelb
              override.battery.charge.low = 20
              override.battery.runtime.low = 480
              # shutdown.return cuts the outlets after offdelay seconds, then restores them ondelay
              # seconds after the command once mains is back. both count from the command. The
              # router shares the outlets, so it gets another 30 minutes, an hour into the outage.
              # If mains returns sooner, the cut still power-cycles the halted nodes
              offdelay = 1800
              ondelay = 1860
          upsd.conf: |
            LISTEN 0.0.0.0 3493
          # upsmon.conf runs upssched on ONBATT and ONLINE, so an outage that outlasts the timer
          # shuts the nodes down while most of the battery is left for the router
          upssched.conf: |
            CMDSCRIPT "/bin/sh /etc/nut/upssched.sh"
            PIPEFN /run/nut/upssched.pipe
            LOCKFN /run/nut/upssched.lock
            AT ONBATT * START-TIMER shutdown 1800
            AT ONLINE * CANCEL-TIMER shutdown
          upssched.sh: |
            [ "$1" = shutdown ] && exec upsmon -c fsd
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nut
  namespace: default
spec:
  groups:
    - name: nut
      rules:
        - alert: UpsOnBattery
          expr: network_ups_tools_battery_charge and on() network_ups_tools_ups_status{flag="OB"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: The UPS lost mains power.
            description: The Eaton UPS is on battery at {{ $value }}% charge. The home nodes power off after 30 minutes on battery, or sooner at 20% charge or 8 minutes of runtime left.
        - alert: UpsLowBattery
          expr: network_ups_tools_ups_status{flag=~"LB|FSD"} == 1
          labels:
            severity: critical
          annotations:
            summary: The home nodes are shutting down on battery.
            description: Every home node is powering off. The router stays up until the UPS cuts its outlets 30 minutes later, then everything restarts once mains returns.
        - alert: UpsReplaceBattery
          expr: network_ups_tools_ups_status{flag="RB"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The UPS battery needs replacing.
            description: The Eaton UPS failed its battery self-test, so its runtime is shorter than reported.
        - alert: UpsOverloaded
          expr: network_ups_tools_ups_load and on() network_ups_tools_ups_status{flag="OVER"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The UPS is overloaded.
            description: The Eaton UPS load is {{ $value }}%.
        # the alerts above, and the automatic shutdown, go quiet when the UPS is unreachable
        - alert: UpsMissing
          expr: absent(network_ups_tools_ups_status{flag="OL"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No UPS data.
            description: No UPS status for 15 minutes, so a power cut won't shut the cluster down. Check the nut pod on talos-uj3-t5w and the UPS USB cable.
