      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 4000
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        controller: main
        type: NodePort
        ports:
          http:
            port: 80
            nodePort: 30997
    persistence:
