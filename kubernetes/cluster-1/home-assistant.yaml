# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-python: "true"
            instrumentation.opentelemetry.io/otel-python-platform: musl
          nodeSelector:
            node.longhorn.io/create-default-disk: config
        # a Deployment, not a StatefulSet: an OrderedReady StatefulSet never replaces a
        # crash-looping pod, so a broken release stays broken after the fix merges.
        # Recreate because the RWO volume can't attach to two pods during a rollout
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
            env:
              # the recorder writes every state change to SQLite, which would flood the traces.
              # 2026.11 aliases httpx to httpx2 on startup and exits if httpx is already imported,
              # and the httpx instrumentor (entry points httpx and httpx2) imports it first
              OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: sqlite3,sqlalchemy,httpx,httpx2
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 4Gi
        globalMounts:
          - path: /config
    service:
      main:
        controller: main
        ports:
          http:
            port: 8123
      local:
        enabled: true
        controller: main
        type: LoadBalancer
        annotations:
          external-mdns.blakecovarrubias.com/hostnames: homeassistant
        ports:
          http:
            port: 8123
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - home-assistant.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - name: home-assistant-main
                port: 8123
