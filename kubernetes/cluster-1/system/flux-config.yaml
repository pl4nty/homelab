apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-1
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/cluster-1
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  patches:
  # release defaults, hoisted out of every HelmRelease. scoped to the default
  # namespace so longhorn, toolhive and kube-arch-scheduler keep their own.
  # spec.interval stays per-release: it is a required field, so a HelmRelease
  # without one fails the API dry-run before any patch is applied
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        maxHistory: 3
        install:
          createNamespace: true
          remediation:
            retries: 3
        upgrade:
          cleanupOnFail: true
          remediation:
            retries: 3
        uninstall:
          keepHistory: false
    target:
      kind: HelmRelease
      namespace: default
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
    - kind: Secret
      name: cluster-secrets
    - kind: ConfigMap
      name: instance-settings
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  namespace: flux-system
spec:
  parentRefs:
  - name: ${CLUSTER_NAME}
    namespace: default
  hostnames:
  - flux-${CLUSTER_NAME}.${PUBLIC_DOMAIN}
  rules:
  - backendRefs:
    - name: webhook-receiver
      port: 80