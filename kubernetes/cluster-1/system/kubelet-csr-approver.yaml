apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubelet-csr-approver
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/postfinance/charts/kubelet-csr-approver
  layerSelector:
    mediaType: 'application/vnd.cncf.helm.chart.content.v1.tar+gzip'
    operation: copy
  ref:
    tag: 1.2.16
    digest: sha256:0c12f1db0483dc850a623dd0eaf4875d9cfa2afaefb6c5d33341bcb4fd1b15ab
---
# kubelets with rotate-server-certificates serve no TLS until their serving CSR is approved,
# so Alloy can't scrape their kubelet or cAdvisor metrics
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubelet-csr-approver
    namespace: flux-system
  values:
    # generated names, plus the pinned Oracle names (talos/node/talos-oci-*)
    providerRegex: ^talos-([a-z0-9]{3}-[a-z0-9]{3}|oci-[a-z0-9-]+)$
    providerIpPrefixes:
      - 192.168.1.0/24
      # Oracle VCN (talos/oracle.sh)
      - 10.10.0.0/24
      # talos-oci-a1's public IP, which the OCI cloud controller adds as its ExternalIP
      - 192.9.186.226/32
      # global IPv6 node IPs (talos/all/cluster.yaml). The ISP prefix can change, so not pinned
      - 2000::/3
    # node hostnames aren't in DNS
    bypassDnsResolution: true
    replicas: 1
