# SMART alerts for Longhorn disks, from the ServiceMonitor in longhorn.yaml.
# longhorn-manager refreshes the data every 10 minutes, so for: and range windows span at least two refreshes.
# NVMe attribute names: https://github.com/henrygd/beszel/blob/main/agent/smart.go (vendored by longhorn-manager)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-disk-health
  namespace: longhorn
spec:
  groups:
    - name: longhorn-disk-health
      rules:
        # smartctl's overall verdict. on NVMe it fails on any critical warning bit:
        # spare below threshold, over temperature, degraded reliability, or read-only media
        - alert: DiskSmartUnhealthy
          expr: longhorn_disk_health == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: A Longhorn disk failed its SMART health check.
            description: SMART health on disk {{ $labels.disk }} of {{ $labels.node }} isn't PASSED. Run `kubectl -n longhorn get nodes.longhorn.io {{ $labels.node }} -o yaml` and read healthData, then evict its replicas before it fails.
        - alert: DiskMediaErrors
          expr: delta(longhorn_disk_health_attribute_raw{attribute="MediaErrors"}[2h]) > 0
          labels:
            severity: warning
          annotations:
            summary: A Longhorn disk reported new unrecovered media errors.
            description: Disk {{ $labels.disk }} of {{ $labels.node }} logged new NVMe media errors in the last 2 hours, which means data integrity failures that the drive couldn't correct.
        # vendor estimate of rated endurance used. it can go past 100
        - alert: DiskWearHigh
          expr: longhorn_disk_health_attribute_raw{attribute="PercentageUsed"} >= 80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: A Longhorn disk has used most of its rated endurance.
            description: Disk {{ $labels.disk }} of {{ $labels.node }} has used {{ $value }}% of its rated write endurance.
        # the alerts above go quiet when SMART isn't readable or the ServiceMonitor stops
        - alert: DiskHealthMissing
          expr: absent(longhorn_disk_health)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Longhorn reports no disk health data.
            description: No longhorn_disk_health series for 1 hour, so SMART alerts for the Longhorn disks can't fire. Check the longhorn-prometheus-servicemonitor scrape and the healthData field in nodes.longhorn.io.
