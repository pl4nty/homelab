# https://github.com/longhorn/longhorn/blob/38fa709ec8476215cf938e9768b4ae67fac9e383/examples/v2/storageclass.yaml
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-v2-data-engine
  namespace: longhorn
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  # backup, backingImage and snapshot related parameters are not supported in SPDK preview stage
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: "ext4"
  dataEngine: "v2"
#  mkfsParams: "-I 256 -b 4096 -O ^metadata_csum,^64bit"
#  nodeSelector: "storage,fast"
#  recurringJobSelector: '[{"name":"snap-group", "isGroup":true},
#                          {"name":"backup", "isGroup":false}]'
#  fromBackup: ""
#  backingImage: "bi-test"
#  backingImageDataSourceType: "download"
#  backingImageDataSourceParameters: '{"url": "https://backing-image-example.s3-region.amazonaws.com/test-backing-image"}'
#  backingImageChecksum: "SHA512 checksum of the backing image"
#  unmapMarkSnapChainRemoved: "ignored"
#  diskSelector: "ssd,fast"
#  nfsOptions: "soft,timeo=150,retrans=3"
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-local
  namespace: default
  annotations:
    # StorageClass parameters are immutable, so let Flux recreate it on change.
    # Bound PVCs keep working: they reference the class by name only.
    kustomize.toolkit.fluxcd.io/force: enabled
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  fsType: ext4
  numberOfReplicas: "1"
  # best-effort, not strict-local: Longhorn can't live-upgrade the engine of an
  # attached strict-local volume, so every Longhorn minor needed downtime.
  # With 1 replica, best-effort still keeps the data on the pod's node.
  dataLocality: best-effort
  # only the 2 TB NVMe disks (d04, uj3) are tagged large, see longhorn.yaml.
  # Keeps the single replica off the 256 GB vpz disk.
  diskSelector: large
  staleReplicaTimeout: "30"
  recurringJobSelector: '[
    {
    "name":"skipbackup",
    "isGroup":true
    }
    ]'
