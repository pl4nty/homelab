apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    timeout: 15m
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # chart only supports a nodeSelector. Skip nodes without the Talos iscsi-tools extension (custom images)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: extensions.talos.dev/iscsi-tools
                              operator: Exists
  values:
    persistence:
      # defaultClass: false # no option to set param for v2 engine
      # one replica per RK1 control plane
      defaultClassReplicaCount: 3
      # defaultDataLocality: best-effort
    csi:
      # 2 so the PDB (minAvailable 1) does not block node drains
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    defaultSettings:
      backupTarget: s3://tplant-homelab-volumes@us-west-004/
      backupTargetCredentialSecret: longhorn-backup
      allowRecurringJobWhileVolumeDetached: true
      # defaultDataPath: /var/lib/longhorn (file-type, not block-type like /dev )
      createDefaultDiskLabeledNodes: true
      # use this to avoid cross-node volume access - but the scheduler doesn't respect it
      # systemManagedComponentsNodeSelector: node.longhorn.io/create-default-disk:config
      v1DataEngine: true
      v2DataEngine: false
      backupstorePollInterval: 0 # only used by DR volumes not backups, expensive S3 list calls
      # upgrade volumes to the default engine image so old engine-image daemonsets can be removed
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    # this also applies to engines :(
    # longhornManager:
    #   nodeSelector:
    #     node.longhorn.io/create-default-disk: config
    longhornUI:
      replicas: 1

# k annotate storageclass longhorn storageclass.kubernetes.io/is-default-class=true

