apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.62.1
    digest: sha256:1135514a01cc11e206f5ff0b568ac30d9defd675022b7a9da88d4a3474fbdf13
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    web:
      # https://fluxoperator.dev/docs/web-ui/user-management/
      # Cloudflare Access (private domain) gates the host, so every visitor
      # shares one identity, bound to flux-web-admin below
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux-web
            groups:
            - flux-web-admins
      httpRoute:
        enabled: true
        parentRefs:
        - name: ${CLUSTER_NAME}
          namespace: default
        hostnames:
        - flux.${PRIVATE_DOMAIN}
---
# read everything, plus reconcile/suspend/resume on Flux objects and
# restart on workloads (predefined by the chart, web.rbac.createRoles)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admins
subjects:
- kind: Group
  name: flux-web-admins
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
