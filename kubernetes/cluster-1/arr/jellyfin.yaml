# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      jellyfin:
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: "12.0"
            env:
              TZ: ${TIMEZONE}
            securityContext:
              # RKMPP needs the VPU device nodes and an unmasked /sys/firmware to read
              # the device tree - privileged is the only way to get both in Kubernetes
              privileged: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
        pod:
          # RKMPP transcoding needs the RK3588 VPU
          nodeSelector:
            kubernetes.io/arch: arm64
    service:
      app:
        controller: *app
        type: NodePort
        ports:
          http:
            port: *port
            nodePort: 30096
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /config
      # both are scratch, so longhorn-local: single replica, skipbackup group
      cache:
        accessMode: ReadWriteOnce
        size: 8Gi
        storageClass: longhorn-local
        globalMounts:
          - path: /cache
      # point Jellyfin's transcode path here rather than the default /cache/transcodes
      transcode:
        accessMode: ReadWriteOnce
        size: 8Gi
        storageClass: longhorn-local
        globalMounts:
          - path: /transcode
      media:
        existingClaim: media
        globalMounts:
          - path: /media
            readOnly: true
