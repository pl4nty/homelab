# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      sonarr:
        containers:
          app:
            # home-operations builds sonarr from the v5 nightly (preview) channel, so this
            # follows it. its database migrations are one-way, so there's no going back to v4
            image: &image
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0@sha256:93b0923dd12afd43247739e19dac59d74c52a15ea12e036b7ced264cffb42574
            env:
              TZ: ${TIMEZONE}
              # the image sets DOTNET_EnableDiagnostics=0, which also blocks the OTel CLR profiler.
              # re-enable diagnostics for the profiler only, without the /tmp IPC pipes or debugger
              DOTNET_EnableDiagnostics: "1"
              DOTNET_EnableDiagnostics_IPC: "0"
              DOTNET_EnableDiagnostics_Debugger: "0"
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__SERVER__PORT: &port 8989
              SONARR__LOG__LEVEL: info
              # the log db is pure write churn on a longhorn volume
              SONARR__LOG__DBENABLED: "False"
              # pinned so recyclarr and prowlarr can talk to a freshly created instance
              SONARR__AUTH__APIKEY:
                secretKeyRef:
                  name: arr
                  key: SONARR_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
        initContainers:
          init-layout:
            image: *image
            command:
              - /bin/sh
              - -c
              - >-
                mkdir -p
                /data/torrents/books /data/torrents/movies
                /data/torrents/music /data/torrents/shows
                /data/usenet/incomplete
                /data/usenet/complete/books /data/usenet/complete/movies
                /data/usenet/complete/music /data/usenet/complete/shows
                /data/media/books /data/media/movies
                /data/media/music /data/media/shows
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-dotnet: "true"
            # self-contained .NET on Alpine
            instrumentation.opentelemetry.io/otel-dotnet-auto-runtime: linux-musl-x64
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          # media is RWO with a single local replica, so follow jellyfin to its node
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/instance
                        operator: In
                        values:
                          - jellyfin
                  topologyKey: kubernetes.io/hostname
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - sonarr.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 4Gi
      # a few MB of scratch that should start empty every restart, so tmpfs -
      # counts against the memory limit rather than ephemeral-storage
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
      media:
        existingClaim: media
        globalMounts:
          - path: /data
