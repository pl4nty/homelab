# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: 0 3 * * *
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 2
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
            args:
              - sync
            env:
              TZ: ${TIMEZONE}
              # .NET writes diagnostic pipes to /tmp, which trips readOnlyRootFilesystem. diagnostics stay on
              # for the OTel CLR profiler only, without the IPC pipes or debugger
              DOTNET_EnableDiagnostics: "1"
              DOTNET_EnableDiagnostics_IPC: "0"
              DOTNET_EnableDiagnostics_Debugger: "0"
              SONARR_API_KEY:
                secretKeyRef:
                  name: arr
                  key: SONARR_API_KEY
              RADARR_API_KEY:
                secretKeyRef:
                  name: radarr
                  key: RADARR_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          restartPolicy: OnFailure
          annotations:
            instrumentation.opentelemetry.io/inject-dotnet: "true"
            # self-contained .NET on Alpine
            instrumentation.opentelemetry.io/otel-dotnet-auto-runtime: linux-musl-x64
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
    persistence:
      # recyclarr clones the TRaSH guides in here on every run
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: "{{ .Release.Name }}"
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
    configMaps:
      config-file:
        data:
          recyclarr.yml: |-
            sonarr:
              anime:
                base_url: http://sonarr:8989
                api_key: !env_var SONARR_API_KEY
                media_naming:
                  series: jellyfin-tvdb
                  season: default
                  episodes:
                    rename: true
                    standard: default
                    daily: default
                    anime: default
                quality_definition:
                  type: anime
                quality_profiles:
                  - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
                    reset_unmatched_scores:
                      enabled: true
            radarr:
              movies:
                base_url: http://radarr:7878
                api_key: !env_var RADARR_API_KEY
                # folder and file names carry [tmdbid-N], which jellyfin matches on
                media_naming:
                  folder: jellyfin-tmdb
                  movie:
                    rename: true
                    standard: jellyfin-tmdb
                quality_definition:
                  type: movie
