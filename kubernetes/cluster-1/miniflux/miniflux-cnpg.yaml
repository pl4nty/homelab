apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-cnpg
  namespace: default
spec:
  instances: 2
  storage:
    size: 4Gi
    storageClass: longhorn-local
  imageName: ghcr.io/cloudnative-pg/postgresql:15.5
  affinity:
    nodeSelector:
      node.longhorn.io/create-default-disk: config
    # longhorn-local is best-effort, so a replica can follow its pod to another
    # node. Required anti-affinity keeps the two instances on separate nodes.
    podAntiAffinityType: required

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: b2

  bootstrap:
    recovery:
      source: miniflux-cnpg

  externalClusters:
    - name: miniflux-cnpg
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: b2
          serverName: miniflux-cnpg

  # otherwise postgres crashes with hugepages enabled
  resources:
    requests:
      memory: 100Mi
      hugepages-2Mi: 100Mi
    limits:
      memory: 1Gi
      hugepages-2Mi: 100Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: miniflux
  namespace: default
spec:
  immediate: true
  schedule: 0 0 0 * * *
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: miniflux-cnpg
