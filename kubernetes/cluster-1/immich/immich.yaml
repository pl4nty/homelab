# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://github.com/immich-app/immich-charts/raw/refs/heads/main/charts/immich/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # top-level keys apply to every component
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # keep off the 8GiB amd64 control plane node
      nodeSelector:
        kubernetes.io/arch: arm64
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6

    immich:
      persistence:
        library:
          existingClaim: immich
      # setting IMMICH_CONFIG_FILE makes admin settings read-only in the UI
      configuration:
        server:
          externalDomain: https://stickers.${PUBLIC_DOMAIN}
          publicUsers: false
        newVersionCheck:
          enabled: false
        passwordLogin:
          enabled: true
        oauth:
          enabled: false
        machineLearning:
          enabled: false
        # geodata import and map tiles aren't useful for stickers
        reverseGeocoding:
          enabled: false
        map:
          enabled: false
        # pg_dumpall duplicates CNPG backups
        backup:
          database:
            enabled: false
        library:
          scan:
            enabled: false
        image:
          # keep transparency
          preview:
            format: webp
        job:
          thumbnailGeneration:
            concurrency: 1
          metadataExtraction:
            concurrency: 2
          backgroundTask:
            concurrency: 2
          search:
            concurrency: 2
          sidecar:
            concurrency: 1
          library:
            concurrency: 1
          migration:
            concurrency: 1
          notifications:
            concurrency: 1
          videoConversion:
            concurrency: 1

    server:
      controllers:
        main:
          # chart forces RollingUpdate, but the RWO library can't attach to two nodes
          rollingUpdate:
            surge: 0
            unavailable: 1
          containers:
            main:
              env:
                TZ: ${TIMEZONE}
                # TODO set to "false" once the admin account exists, otherwise anyone can claim it
                IMMICH_ALLOW_SETUP: "true"
                DB_HOSTNAME: immich-cnpg-rw
                DB_DATABASE_NAME: immich
                DB_USERNAME:
                  secretKeyRef:
                    name: immich-cnpg-superuser
                    key: username
                DB_PASSWORD:
                  secretKeyRef:
                    name: immich-cnpg-superuser
                    key: password
                DB_VECTOR_EXTENSION: vectorchord
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 1Gi
                  ephemeral-storage: 500Mi
      route:
        main:
          parentRefs:
            - namespace: default
              name: ${CLUSTER_NAME}
          hostnames:
            - stickers.${PUBLIC_DOMAIN}
          rules:
            - backendRefs:
                - identifier: main
                  port: 2283

    # only used for the job queue
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              args:
                - --save
                - ""
                - --appendonly
                - "no"
                - --maxmemory
                - 48mb
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi

    # saves ~1-2GiB
    machine-learning:
      enabled: false
