# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hister
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # keep off the 8GiB amd64 control plane node
      nodeSelector:
        kubernetes.io/arch: arm64
      # the image runs as 65532, which can't write to fresh volumes
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        # RWO volumes can't attach to two nodes during a rollout
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/asciimoo/hister
              tag: v0.21.0@sha256:4dab1cbd7aabe8ade8e696e4085ecd3254e1170467c4502debec792a904abdbc
            # no access token: Cloudflare Access gates the route, and SearXNG
            # queries the service in-cluster
            env:
              HISTER__SERVER__ADDRESS: 0.0.0.0:4433
              HISTER__SERVER__BASE_URL: https://hister.${PRIVATE_DOMAIN}
              HISTER__APP__SEARCH_URL: https://search.${PRIVATE_DOMAIN}/search?q={query}
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /health
              readiness: *probe
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
                ephemeral-storage: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 4433
    persistence:
      data:
        # keep the index if a failed install is remediated by uninstalling
        retain: true
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /hister/data
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - hister.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 4433
