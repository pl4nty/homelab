# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ataxx
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        # amd64-only: the arm64 Haskell build under QEMU exceeds the 6h CI limit
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/ataxx
              tag: latest@sha256:ee25a2594b4a458195f964cce0b8728c3276e37ad8c6f8b47148d7acd96dc088
            args:
              - --p1
              - human
              - --p2
              - ai
            probes:
              liveness:
                enabled: true
                custom: true
                # ataxx doesn't have a "new game" button, so we just restart it regularly
                spec:
                  failureThreshold: 1
                  periodSeconds: 300
                  exec:
                    command:
                      - bash
                      - -c
                      - "exit 1"
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - ataxx.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: ataxx
                port: 3000
