# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://github.com/kubernetes-sigs/headlamp/raw/refs/heads/main/charts/headlamp/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: headlamp
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      # default image is amd64-only, and nodeSelector isn't available
      # ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.2.0
      - image: iotops/headlamp-plugin-flux:latest
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
        name: headlamp-plugins
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
    config:
      pluginsDir: /build/plugins
      # relies on private domain auth
      unsafeUseServiceAccountToken: true
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: default
spec:
  parentRefs:
  - name: ${CLUSTER_NAME}
    namespace: default
  hostnames:
  - headlamp.${PRIVATE_DOMAIN}
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
