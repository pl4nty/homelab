# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app diff-viewer
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      # keep off the 8GiB amd64 control plane node
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        # RWO volumes can't attach to two nodes during a rollout
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/diff-viewer
              tag: latest@sha256:PENDING
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              # uploads are read whole, up to MAX_BYTES (16MiB)
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      data:
        # keep shared diffs if a failed install is remediated by uninstalling
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - diff.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
