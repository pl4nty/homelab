# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ipa-web
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/ipa-web
              tag: latest@sha256:a4eaf2a1ffe53d152396b6ef9f056c5dbf6d2a1e5e8c3e3b8600e9d2d832fe8e
            env:
              GIN_MODE: release
              DATA_DIR: /data
              XDG_CACHE_HOME: /data/.cache
              # Store hardware identity the Apple account already knows
              MAC_ADDRESS: "09:26:2E:B0:AF:06"
              CACHE_TTL: 24h
            # downloads whole IPAs to /tmp, past the namespace's 100Mi LimitRange default
            resources:
              requests:
                ephemeral-storage: 100Mi
              limits:
                ephemeral-storage: 4Gi
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  # first start downloads ~150MB of Apple and Unicorn runtime assets
                  failureThreshold: 60
                  periodSeconds: 10
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - ios-app-data.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: *app
                port: 8080
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
