# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      tolerations:
      - key: topology.kubernetes.io/region
        operator: Exists
        effect: PreferNoSchedule
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        # no OTel java agent: on cluster-1 the operator mounts it at /otel-auto-instrumentation-java-main but
        # points -javaagent at /otel-auto-instrumentation-java, so the JVM exits at startup
        containers:
          main:
            image:
              repository: ghcr.io/stirling-tools/s-pdf
              tag: 3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
            env:
              SYSTEM_ENABLEANALYTICS: false
              # upstream settings.yml defaults security.enableLogin to true; this is a public tool
              SECURITY_ENABLELOGIN: false
            # the java agent and PDF temp files outgrow cluster-1's 100Mi ephemeral-storage default (system/limitrange.yaml)
            resources:
              requests:
                ephemeral-storage: 256Mi
              limits:
                ephemeral-storage: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - pdf.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: stirling-pdf
                port: 8080
