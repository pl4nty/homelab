apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-cnpg
  namespace: default
spec:
  instances: 2
  storage:
    size: 10Gi
    storageClass: longhorn-local
  # system images carry barman-cloud for the backups below
  imageName: ghcr.io/cloudnative-pg/postgis:18.6-3.7.0-system-trixie
  affinity:
    nodeSelector:
      node.longhorn.io/create-default-disk: config
    # longhorn-local is best-effort, so a replica can follow its pod to another
    # node. Required anti-affinity keeps the two instances on separate nodes.
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
      # postgis isn't a trusted extension, so the app owner can't create it in its migrations
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis

  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      endpointURL: https://s3.us-west-004.backblazeb2.com
      destinationPath: s3://tplant-homelab-postgres
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cloudnative-pg
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  # otherwise postgres crashes with hugepages enabled
  resources:
    requests:
      memory: 100Mi
      hugepages-2Mi: 100Mi
    limits:
      memory: 1Gi
      hugepages-2Mi: 100Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: dawarich
  namespace: default
spec:
  immediate: true
  schedule: 0 0 0 * * *
  backupOwnerReference: self
  cluster:
    name: dawarich-cnpg
