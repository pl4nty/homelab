# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backup-cloudflare
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 0 * * *"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/flares
              tag: latest@sha256:515ff3d1d451f355fca05ffc257e34d88318685b426f129988e903cdda1e502d
            # flares moved to subcommands, the old --all --export flags now fail with usage
            args:
              - export
              - --all
            envFrom:
              - secretRef:
                  name: backup-cloudflare
            workingDir: /usr/backup
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /usr/backup
