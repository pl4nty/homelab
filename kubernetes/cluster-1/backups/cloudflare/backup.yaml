# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backup-cloudflare
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 0 * * *"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/flares
              tag: latest@sha256:b20e5262bc82e3b3c6b06ee647c17c4847962f865a38a1d4a88102b5ba5a2efe
            args:
              - --all
              - --export
            envFrom:
              - secretRef:
                  name: backup-cloudflare
            workingDir: /usr/backup
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /usr/backup
