# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backup-cloudflare
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        type: cronjob
        cronjob:
          schedule: "0 0 * * *"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/flares
              tag: latest@sha256:f8e9f73b39a2e90fc9a619f17f67b4eae39da58e27010812267afdb0f838d2b2
            # flares moved to subcommands, the old --all --export flags now fail with usage
            args:
              - export
              - --all
            envFrom:
              - secretRef:
                  name: backup-cloudflare
            workingDir: /usr/backup
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /usr/backup
