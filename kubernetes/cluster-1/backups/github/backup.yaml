# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backup-github
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-python: "true"
            instrumentation.opentelemetry.io/otel-python-platform: musl
          nodeSelector:
            node.longhorn.io/create-default-disk: config
        type: cronjob
        cronjob:
          schedule: "0 0 * * *"
          # a full run takes ~4.5-5h, so with 6h a single retry (DNS blip, GitHub 422)
          # restarted from scratch and always hit the deadline. 20h still ends before the next run
          activeDeadlineSeconds: 72000
        containers:
          main:
            image:
              repository: ghcr.io/josegonzalez/python-github-backup
              tag: 0.69.1@sha256:558c9501212ebac7735e960b2888aecd56b5bc4e9e0a49410a6ecc4d68b8a9fa
            args:
              - pl4nty
              - --token-fine
              - file:///usr/token
              - --incremental-by-files
              - --output
              - /usr/backup
              # - --all includes --assets, which crashes on azure-favicons
              - --starred
              - --watched
              - --followers
              - --following
              - --issues
              - --issue-comments
              - --issue-events
              - --pulls
              - --pull-comments
              - --pull-commits
              - --pull-details
              - --labels
              - --hooks
              - --milestones
              - --security-advisories
              - --repositories
              - --bare
              - --lfs
              # git lfs prune scans every ref, and winget-recipes' 12k refs made it take ~13h
              - --no-prune
              - --wikis
              # gists are uninitialized and cause crash? maybe fine-grained tokens aren't supported
              # - --gists
              - --private
              # backup size becoming pretty large...
              - --fork
              - --releases
              - --attachments
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 64Gi
        globalMounts:
          - path: /usr/backup
      token:
        type: secret
        name: backup-github
        globalMounts:
          - path: /usr/token
            subPath: token
