apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: wanderlog
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  # apps/wanderlog-mcp (stdio); first digest is the PR build, Renovate moves it to main's latest
  image: ghcr.io/pl4nty/wanderlog-mcp:latest@sha256:db473f3092c1a96b139abe4abaf960c192722a0bc42cee8d1f2c35caea7878a5
  env:
    - name: HOME
      value: /tmp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  secrets:
    # connect.sid session cookie from wanderlog.com (HttpOnly, lasts ~1 year)
    - name: toolhive
      key: wanderlog-cookie
      targetEnvName: WANDERLOG_COOKIE
