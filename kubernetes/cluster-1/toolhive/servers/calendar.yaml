apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: calendar
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  externalAuthConfigRef:
    name: entra-upstream
  image: ghcr.io/obot-platform/microsoft-office-365-mcp/microsoft365-calendar:latest@sha256:4d843ada290fb679e08d7dd7b0b04c4093ade78028b39c382b2bc2efa1bbba32
  transport: streamable-http
  mcpPort: 9000
  # Image uses a binary at /root
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
