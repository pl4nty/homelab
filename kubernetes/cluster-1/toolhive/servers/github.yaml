apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: github
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  remoteUrl: https://api.githubcopilot.com/mcp/
  transport: streamable-http
  headerForward:
    addPlaintextHeaders:
      X-MCP-Toolsets: notifications,issues,pull_requests
      X-MCP-Readonly: "true"
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: toolhive
          key: github-authorization
