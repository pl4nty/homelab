apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: home-assistant
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  image: ghcr.io/homeassistant-ai/ha-mcp:9.3.0@sha256:8da893a58da84be7c6e2a8057dfac4fc74821bc5bf17676b5223e439e914db2b
  transport: streamable-http
  mcpPort: 8086
  # Upstream's image has a non-numeric USER (mcpuser, uid 999)
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: home
              mountPath: /home/mcpuser
      volumes:
        - name: home
          emptyDir: {}
  env:
    - name: HOMEASSISTANT_URL
      value: http://home-assistant-main.default:8123
  secrets:
    - name: toolhive
      key: home-assistant-token
      targetEnvName: HOMEASSISTANT_TOKEN
