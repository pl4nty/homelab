apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github-events
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  image: ghcr.io/pl4nty/github-events:latest@sha256:94997d8398e0522919fa68f688535365d6251b4264f40040c49b67fd6482d0ef
  transport: streamable-http
  mcpPort: 8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: toolhive
                  key: github-authorization
            - name: GITHUB_QUERY
              value: is:pr author:pl4nty repo:microsoft/winget-pkgs
            - name: CLAUDE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: toolhive
                  key: claude-webhook-url
            - name: CLAUDE_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: toolhive
                  key: claude-webhook-token
