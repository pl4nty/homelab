apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: onedrive
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  externalAuthConfigRef:
    name: entra-upstream
  image: ghcr.io/obot-platform/microsoft-office-365-mcp/microsoft365-onedrive:latest@sha256:4c331cc862c8ce9ec62b864ccc07ff77adf41be3474fd1e52e2accadbf55eba6
  transport: streamable-http
  mcpPort: 9000
  # Image uses a binary at /root
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
