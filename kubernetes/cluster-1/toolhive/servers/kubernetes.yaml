apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: toolhive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: toolhive-system
---
# v0.0.69 dropped CLI flags for TOML config. The image sets
# MCP_CONFIG_PATH=/etc/kubernetes-mcp-server/config.toml, so this replaces its default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp
  namespace: toolhive-system
data:
  config.toml: |
    port = "8080"
    stateless = true
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  image: quay.io/containers/kubernetes_mcp_server:v0.0.69@sha256:1da9d62ad0c008a6cadcf2718c86c2e2d18753ca1d9f1f3313068980794b24f2
  serviceAccount: kubernetes-mcp
  transport: streamable-http
  mcpPort: 8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp
