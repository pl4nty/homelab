# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://github.com/containers/kubernetes-mcp-server/raw/refs/heads/main/charts/kubernetes-mcp-server/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: toolhive-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp-server
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: false
    rbac:
      extraClusterRoleBindings:
        - name: cluster-admin
          roleRef:
            name: cluster-admin
            external: true
    config:
      stateless: true
      # https://github.com/containers/kubernetes-mcp-server/blob/main/docs/scaling.md
      # 128Mi + 2 * max_in_flight * 72Mi of default caps stays under the limit
      max_in_flight: 2
      telemetry:
        endpoint: http://k8s-monitoring-alloy-receiver.monitoring-system:4317
        logs_exporter: none
        metrics_exporter: none
    resources:
      limits:
        memory: 512Mi
---
# Registers the chart's Service with the vMCP without a ToolHive proxy.
# The name stays "kubernetes" so tool names keep working.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: kubernetes
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  remoteUrl: http://kubernetes-mcp-server.toolhive-system.svc.cluster.local:8080/mcp
  allowPrivateEndpoint: true
  transport: streamable-http
