apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: outlook
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  externalAuthConfigRef:
    name: entra-upstream
  image: ghcr.io/obot-platform/microsoft-office-365-mcp/outlook:latest@sha256:9fe10a5583e7d897fd6cd8436d22ccfaa1f1dc4a387051f2a48110ee78eac8fd
  transport: streamable-http
  mcpPort: 9000
  # Image reads the token from x-forwarded-access-token, but upstreamInject sends
  # Authorization, which FastMCP 3 get_http_headers() drops unless asked for
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - "/app/outlook/.venv/bin/python"
            - "-c"
            - |
              import app.client as _c
              from fastmcp.server.dependencies import get_http_headers
              from fastmcp.exceptions import ToolError
              def _get_access_token():
                  h = get_http_headers(include={"authorization"})
                  a = h.get("authorization", "")
                  t = h.get("x-forwarded-access-token") or (a.split(" ", 1)[-1] if a else None)
                  if not t:
                      raise ToolError("No access token found in headers")
                  return t
              _c.get_access_token = _get_access_token
              from app.main import streamable_http_server
              streamable_http_server()
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: HOME
              value: /tmp
            # Image defaults to /mcp/outlook but ToolHive proxies to /mcp
            - name: MCP_PATH
              value: /mcp
      volumes:
        - name: tmp
          emptyDir: {}
