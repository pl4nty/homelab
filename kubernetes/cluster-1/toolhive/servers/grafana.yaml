apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  image: docker.io/grafana/mcp-grafana:2.0.2@sha256:78d208116ec52b09b44f0eca66892073b39aefcb64483c54d43255c8eab7e97a
  args:
    - -t
    - stdio
  env:
    - name: GRAFANA_URL
      value: https://tplant.grafana.net
  secrets:
    - name: toolhive
      key: grafana-service-account-token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
