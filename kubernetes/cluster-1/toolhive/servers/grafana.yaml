apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  image: docker.io/grafana/mcp-grafana:1.0.0@sha256:5efeafd01cd7e1aea9c4b0f03305951f2944db8f43e5ae290cce9578c977f241
  args:
    - -t
    - stdio
  env:
    - name: GRAFANA_URL
      value: https://tplant.grafana.net
  secrets:
    - name: toolhive
      key: grafana-service-account-token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
