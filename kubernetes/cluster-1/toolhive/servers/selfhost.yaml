apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: selfhost
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  externalAuthConfigRef:
    name: entra-upstream
  image: ghcr.io/pl4nty/mcp:latest@sha256:94425d5597dade3f550f79d4f6d21ed12098293fd08cfa0f5d797d4e03239c8a
  transport: streamable-http
  mcpPort: 8000
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: toolhive
                  key: entra-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: toolhive
                  key: entra-client-secret
      volumes:
        - name: tmp
          emptyDir: {}
