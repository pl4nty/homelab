apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: contact
  namespace: toolhive-system
spec:
  groupRef:
    name: toolhive
  telemetryConfigRef:
    name: toolhive
  externalAuthConfigRef:
    name: entra-upstream
  image: ghcr.io/obot-platform/microsoft-office-365-mcp/microsoft365-contact:latest@sha256:9702d7b9f07dfe4e16812022fe0e7322aa39a758b4d78352ab61acffab5a2c48
  transport: streamable-http
  mcpPort: 9000
  # Image uses a binary at /root
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
