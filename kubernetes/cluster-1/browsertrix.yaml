apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browsertrix
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: browsertrix
      version: 1.26.5
      sourceRef:
        kind: HelmRepository
        name: browsertrix
        namespace: flux-system
  # chart leaves minio on the default RollingUpdate, but its RWO volume can't attach to a second node
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: local-minio
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
          # the chart has no pod annotation values. api and op are both FastAPI apps
          - target:
              kind: Deployment
              name: browsertrix-cloud-backend
            patch: |
              - op: add
                path: /spec/template/metadata/annotations/instrumentation.opentelemetry.io~1inject-python
                value: "true"
              - op: add
                path: /spec/template/metadata/annotations/instrumentation.opentelemetry.io~1python-container-names
                value: api,op
  values:
    superuser:
      email: tom@tplant.com.au
    # minio_local: false

    # storages:
    #   - name: "default"
    #     access_key: <access key>
    #     secret_key: <secret key>

    #     endpoint_url: "https://s3.<region>.amazonaws.com/bucket/path/"
