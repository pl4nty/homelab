apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browsertrix
  namespace: default
spec:
  interval: 15m
  chart:
    spec:
      chart: browsertrix
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: browsertrix
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # chart leaves minio on the default RollingUpdate, but its RWO volume can't attach to a second node
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: local-minio
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    superuser:
      email: tom@tplant.com.au
    # minio_local: false

    # storages:
    #   - name: "default"
    #     access_key: <access key>
    #     secret_key: <secret key>

    #     endpoint_url: "https://s3.<region>.amazonaws.com/bucket/path/"