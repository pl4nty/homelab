# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kutt
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: docker.io/kutt/kutt
              tag: v3.2.6@sha256:fa3d24a89b04e0feb542ed7d3c77993d58dbcc1406e5291a369595d543886146
            env:
              DEFAULT_DOMAIN: l.${PRIVATE_DOMAIN}
              DB_FILENAME: /var/lib/kutt/data.sqlite
              # links are only created by signed-in users, and registration needs email, so this stays a private shortener
              DISALLOW_ANONYMOUS_LINKS: "true"
              DISALLOW_REGISTRATION: "true"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - l.${PRIVATE_DOMAIN}
        rules:
          - backendRefs:
              - name: *app
                port: 3000
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /var/lib/kutt
