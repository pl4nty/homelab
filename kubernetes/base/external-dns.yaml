# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/heads/master/charts/external-dns/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    interval: 2m
    logLevel: debug
    provider: cloudflare
    env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: external-dns
          key: CF_API_TOKEN
    policy: sync
    sources:
    - service
    txtOwnerId: ${CLUSTER_NAME}
    serviceMonitor:
      enabled: true
    resources:
      requests:
        memory: 100Mi
        cpu: 25m
      limits:
        memory: 250Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns
  namespace: default
spec:
  groups:
    - name: external-dns
      rules:
        # syncs every 2m, and the timestamp only moves after a successful sync
        - alert: ExternalDNSSyncStale
          expr: time() - max by (cluster, namespace) (external_dns_controller_last_sync_timestamp_seconds) > 900
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: external-dns has stopped syncing.
            description: external-dns on {{ $labels.cluster }} last synced with Cloudflare {{ $value | humanizeDuration }} ago.
