# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://raw.githubusercontent.com/grafana/k8s-monitoring-helm/refs/heads/main/charts/k8s-monitoring/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: k8s-monitoring
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    cluster:
      name: ${CLUSTER_NAME:=bootstrap}
    destinations:
      metrics:
        type: prometheus
        url: https://prometheus-prod-09-prod-au-southeast-0.grafana.net/api/prom/push
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring-metrics
          namespace: monitoring-system
        metricProcessingRules: |-
          write_relabel_config {
            source_labels = ["namespace","pod"]
            separator = "@"
            regex = "flux-system@(.+)-.+-.+"
            target_label = "uid"
            replacement = ""
          }
          write_relabel_config {
            source_labels = ["namespace","pod"]
            separator = "@"
            regex = "flux-system@(.+)-.+-.+"
            target_label = "pod"
            replacement = "$1"
          }
          // previews are tested over HTTP, and every push churns ~45 new series
          write_relabel_config {
            source_labels = ["namespace","pod","deployment","replicaset","owner_name"]
            separator = "@"
            regex = "default@.*-pr-[0-9]+.*"
            action = "drop"
          }
        queueConfig:
          # Grafana Cloud rejects older samples, but still bills them as DPM
          sampleAgeLimit: 1h
          # an active series limit 429 rejects only the new series, and retrying it stalls every other series
          retryOnHttp429: false
        # load PrometheusRule objects into the Grafana Cloud ruler. the sync deletes rule groups
        # under its prefix that it didn't create, so each cluster needs its own prefix. the matcher
        # scopes each cluster's copy of a base rule to that cluster's series.
        # alloy-metrics, since the chart only renders this destination's secret on collectors that
        # write to it. clustered instances elect one leader to sync
        rules:
          enabled: true
          collector: alloy-metrics
          address: https://prometheus-prod-09-prod-au-southeast-0.grafana.net
          mimirNamespacePrefix: ${CLUSTER_NAME:=bootstrap}
          # LogQL rules, loaded by loki.rules.kubernetes below
          labelExpressions:
            - key: ruler
              operator: NotIn
              values:
                - loki
          extraArguments: |-
            external_labels = {"cluster" = "${CLUSTER_NAME:=bootstrap}"}
            extra_query_matchers {
              matcher {
                name       = "cluster"
                match_type = "="
                value      = "${CLUSTER_NAME:=bootstrap}"
              }
            }
      logs:
        type: loki
        url: https://logs-prod-004.grafana.net/loki/api/v1/push
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring-logs
          namespace: monitoring-system
      otlp:
        type: otlp
        url: https://otlp-gateway-prod-au-southeast-0.grafana.net/otlp
        protocol: http
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring
          namespace: monitoring-system

    clusterMetrics:
      enabled: true
      # control plane sources have no default allowlist, and a full apiserver scrape is thousands of
      # series per instance. these keep health and leader signals only, ~100 series.
      # Talos binds the scheduler and controller-manager to localhost unless talos/control-plane
      # sets bind-address
      controlPlane:
        enabled: true
      apiServer:
        # 5xx only: a request counter per resource, verb and code would be ~500 series per apiserver
        extraMetricProcessingRules: |-
          rule {
            source_labels = ["__name__","code"]
            separator     = "@"
            regex         = "apiserver_request_total@[^5].*"
            action        = "drop"
          }
        metricsTuning:
          includeMetrics:
            - apiserver_current_inflight_requests
            - apiserver_request_total
            - apiserver_requested_deprecated_apis
            - apiserver_storage_size_bytes
            - kubernetes_build_info
      kubeControllerManager:
        metricsTuning:
          includeMetrics:
            - leader_election_master_status
      kubeScheduler:
        metricsTuning:
          includeMetrics:
            - leader_election_master_status
            - scheduler_pending_pods
            - scheduler_schedule_attempts_total
      kubeDNS:
        metricsTuning:
          includeMetrics:
            - coredns_dns_responses_total
            - coredns_forward_healthcheck_broken_total
            - coredns_panics_total
      # Talos kube-proxy serves metrics on localhost only
      kubeProxy:
        enabled: false
      kubelet:
        metricsTuning:
          excludeMetrics:
            - kubelet_cgroup_manager_duration_seconds_bucket
            - kubelet_pleg_relist_interval_seconds_bucket
            - kubelet_pod_start_duration_seconds_bucket
            # kubelet dashboard only
            - kubelet_runtime_operations_(errors_)?total
            - storage_operation_duration_seconds_count
            - volume_manager_total_volumes
      cadvisor:
        metricsTuning:
          excludeMetrics:
            # no swap on Talos
            - container_memory_swap
            # only feeds a recording rule for the mixin dashboards
            - container_memory_cache
            # byte counters already cover pod IO and traffic, and node_network_*_drop_total keeps drops
            - container_fs_(reads|writes)_total
            - container_network_(receive|transmit)_packets(_dropped)?_total
      kube-state-metrics:
        # Unknown pod phase is deprecated, and the "true" series already reads 0 for an unknown status.
        # KubePersistentVolumeErrors only reads Failed and Pending volumes.
        # A CronJob keeps its last failed Job until the next failure, so kubernetes-mixin's KubeJobFailed
        # kept firing after later runs succeeded. CronJob Jobs are named <cronjob>-<minutes since epoch>
        # and KubeCronJobNotSucceeded in alerts.yaml covers them, so drop kube_job_failed for those only
        extraMetricProcessingRules: |-
          rule {
            source_labels = ["__name__","phase","condition","status"]
            separator = "@"
            regex = "kube_pod_status_phase@Unknown@.*|kube_pod_status_ready@.*@unknown@.*|kube_deployment_status_condition@.*@unknown|kube_persistentvolume_status_phase@(Available|Released)@.*|kube_persistentvolumeclaim_status_phase@Lost@.*"
            action = "drop"
          }
          rule {
            source_labels = ["__name__","job_name"]
            separator = "@"
            regex = "kube_job_failed@.+-[0-9]{8,}"
            action = "drop"
          }
        metricsTuning:
          excludeMetrics:
            - kube_configmap_.*
            - kube_pod_status_reason
            - kube_replicaset_created
            - kube_replicaset_metadata_generation
            - kube_replicaset_spec_replicas
            - kube_replicaset_status_.*
            - kube_secret_metadata_resource_version
      collector: alloy-metrics
    hostMetrics:
      linuxHosts:
        enabled: true
        # the chart makes a target per container, so the portless mmc-health sidecar was scraped
        # too, failed with up=0 and fired NodeExporterDown on every node
        extraDiscoveryRules: |-
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            regex = "node-exporter"
            action = "keep"
          }
        # one veth per pod, renamed on every restart, and cAdvisor's container_network_* already covers pods.
        # loopback never leaves the node, and the kernel's tunnel and dummy devices sit idle
        extraMetricProcessingRules: |-
          rule {
            source_labels = ["__name__","device"]
            separator = "@"
            regex = "node_network_.+@(veth.+|lo|dummy0|ip6tnl0|sit0|teql0|tunl0)"
            action = "drop"
          }
        metricsTuning:
          # eMMC wear, from the mmc-health sidecar below
          includeMetrics:
            - mmc_.*
          excludeMetrics:
            - node_cpu_(scaling_)?frequency_.*
            - node_cpu_guest_seconds_total
            - node_cpu_online
            - node_cpu_scaling_governor
            - node_filesystem_device_error
            - node_filesystem_mount_info
            - node_filesystem_purgeable_bytes
            - node_filesystem_readonly
      enabled: true
      collector: alloy-metrics
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
        # replaces the chart's list, so it repeats the chart's fs-types-exclude
        extraArgs:
          - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs)$
          - --collector.textfile.directory=/run/textfile
        sidecarVolumeMount:
          - name: textfile
            mountPath: /run/textfile
            readOnly: false
        # eMMC has no SMART. the kernel exposes JEDEC wear estimates in sysfs, which node-exporter
        # doesn't read: life_time per cell type (0x01 = 0-10% used ... 0x0A = 90-100%, 0x0B = past
        # rated life) and pre_eol_info (reserved blocks: 0x01 normal, 0x02 warning, 0x03 urgent).
        # 0x00 means the eMMC doesn't report it. runs on the node-exporter image's busybox.
        # the script avoids brace expansion, since Flux substitutes it. mmcblk0bootN share the card
        sidecars:
          - name: mmc-health
            volumeMounts:
              - name: sys
                mountPath: /host/sys
                readOnly: true
            command: [/bin/sh, -c]
            args:
              - |
                while :; do
                  for d in /host/sys/block/mmcblk[0-9]/device; do
                    [ -r "$d/life_time" ] || continue
                    n=$(basename "$(dirname "$d")")
                    set -- $(cat "$d/life_time" "$d/pre_eol_info")
                    printf 'mmc_life_time_estimate{device="%s",type="A"} %d\nmmc_life_time_estimate{device="%s",type="B"} %d\nmmc_pre_eol_info{device="%s"} %d\n' "$n" "$1" "$n" "$2" "$n" "$3"
                  done > /run/textfile/mmc.tmp && mv /run/textfile/mmc.tmp /run/textfile/mmc.prom
                  sleep 3600
                done
      # energy metrics
      # kepler:
      # cost metrics
      # opencost:
    clusterEvents:
      enabled: true
      collector: alloy-singleton
    # journald isn't available on Talos
    # nodeLogs:
    # read /var/log/pods on each node. Streaming via the kubernetes API holds a kubelet
    # inotify instance per container, which exhausted the limit on OKE and replaced
    # pod logs with "failed to create fsnotify watcher: too many open files"
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      # stdio MCP servers write JSON-RPC responses to stdout, eg a 22KB tools/list every
      # health check. ~225MB/day, most of the log volume
      extraLogProcessingStages: |-
        stage.match {
          selector            = `{namespace="toolhive-system", container="mcp", stream="stdout"} |~ "^[{]\"(jsonrpc|result)\""`
          action              = "drop"
          drop_counter_reason = "mcp_jsonrpc"
        }
    applicationObservability:
      enabled: true
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true
      traces:
        filters:
          span:
            # toolhive vMCP polls every backend for health and capabilities, ~300k spans/day.
            # real sessions still keep their tools/call spans
            - resource.attributes["k8s.namespace.name"] == "toolhive-system" and IsMatch(attributes["mcp.method.name"], "^(initialize|server/discover|notifications/.*|(tools|prompts|resources|resources/templates)/list)$")
            - resource.attributes["k8s.namespace.name"] == "toolhive-system" and attributes["http.request.method"] == "DELETE" and attributes["url.path"] == "/mcp"
            # Beyla: Go's per-request goroutine queue/processing children, Redis (dawarich's Sidekiq polls its
            # sidecar ~400 times a minute), probe and scrape endpoints, and controllers' Kubernetes API watches
            - resource.attributes["telemetry.sdk.name"] == "beyla" and (name == "in queue" or name == "processing")
            - resource.attributes["telemetry.sdk.name"] == "beyla" and attributes["db.system.name"] == "redis"
            - resource.attributes["telemetry.sdk.name"] == "beyla" and kind == SPAN_KIND_SERVER and IsMatch(attributes["url.path"], "^/(healthz?|livez|readyz?|ready|metrics|ping|failsafe|api/v1/health)$")
            - resource.attributes["telemetry.sdk.name"] == "beyla" and kind == SPAN_KIND_CLIENT and attributes["server.address"] == "10.96.0.1"
            # qBittorrent peer connections show up as ~6k CONNECT client spans per 10 min
            - resource.attributes["telemetry.sdk.name"] == "beyla" and kind == SPAN_KIND_CLIENT and name == "CONNECT"
      collector: alloy-receiver
    # eBPF HTTP/gRPC/SQL spans (Beyla, built on OBI) for apps without an OTel SDK: nginx, static-web-server,
    # Haskell, bun, Go, Ruby, PHP, C++. one privileged pod per node instead of the operator's per-pod Go sidecar.
    # it skips processes that already export OTLP, so operator-injected apps aren't traced twice
    autoInstrumentation:
      enabled: true
      # scrapes Beyla's metrics endpoint, which drops everything below
      collector: alloy-metrics
      beyla:
        # each node watches the API itself, instead of a 256Mi cache Deployment
        k8sCache:
          replicas: 0
        # traces only. Beyla's RED/network metrics would cost thousands of active series
        metricsTuning:
          excludeMetrics:
            - .+
        # 512Mi OOMKilled on 4 of 6 nodes while it attached to every process. ~250-450Mi steady
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 1Gi
        config:
          data:
            # the chart requires a metrics endpoint. keep the cheapest feature, since they're all dropped
            prometheus_export:
              features:
                - application
            discovery:
              instrument:
                - k8s_namespace: default
              # replaces the chart's default exclusion, so it's repeated first. pods the operator injects
              # are skipped up front, since detecting their OTLP export lets their first spans through twice.
              # CNPG instance managers only poll their own Postgres
              exclude_instrument:
                - exe_path: "{*alloy*,*otelcol*,*beyla*}"
                - k8s_pod_annotations:
                    instrumentation.opentelemetry.io/inject-dotnet: "true"
                - k8s_pod_annotations:
                    instrumentation.opentelemetry.io/inject-java: "true"
                - k8s_pod_annotations:
                    instrumentation.opentelemetry.io/inject-nodejs: "true"
                - k8s_pod_annotations:
                    instrumentation.opentelemetry.io/inject-python: "true"
                - k8s_pod_annotations:
                    instrumentation.opentelemetry.io/inject-sdk: "true"
                - k8s_pod_labels:
                    cnpg.io/cluster: "*"
              exclude_otel_instrumented_services: true
    # just use prom CRDs
    # annotationAutodiscovery:
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
      # Go runtime and process metrics, which every exporter repeats
      podMonitors:
        metricsTuning:
          excludeMetrics:
            - go_.*
            - process_.*
            - promhttp_.*
      serviceMonitors:
        metricsTuning:
          excludeMetrics:
            - go_.*
            - process_.*
            - promhttp_.*
    # 4GB/day but only 50GB/month limit
    # profiling:
    # likely high metrics
    # integrations:
    selfReporting:
      enabled: false
    collectors:
      alloy-metrics:
        presets:
          - clustered
          - statefulset
        # etcd runs as a Talos service rather than a pod, so it's scraped by node. it serves plain
        # HTTP metrics on 2381 once talos/control-plane sets listen-metrics-urls.
        # leader, size and disk latency only (eMMC and power loss, see the 2026-11-03 incident), ~130 series
        extraConfig: |-
          discovery.kubernetes "etcd" {
            role = "node"

            selectors {
              role  = "node"
              label = "node-role.kubernetes.io/control-plane"
            }
          }

          discovery.relabel "etcd" {
            targets = discovery.kubernetes.etcd.targets

            rule {
              source_labels = ["__meta_kubernetes_node_address_InternalIP"]
              replacement   = "$1:2381"
              target_label  = "__address__"
            }

            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "instance"
            }
          }

          prometheus.scrape "etcd" {
            targets    = discovery.relabel.etcd.output
            job_name   = "integrations/etcd"
            forward_to = [prometheus.relabel.etcd.receiver]

            clustering {
              enabled = true
            }
          }

          prometheus.relabel "etcd" {
            rule {
              source_labels = ["__name__"]
              regex         = "up|etcd_server_has_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_failed_total|etcd_mvcc_db_total_size_in_(use_in_)?bytes|etcd_disk_(wal_fsync|backend_commit)_duration_seconds_(bucket|sum|count)"
              action        = "keep"
            }

            forward_to = [prometheus.remote_write.metrics.receiver]
          }
      alloy-singleton:
        presets:
          - singleton
        # the chart only syncs rules to prometheus destinations. LogQL rules need the cluster
        # matcher written in, since loki.rules.kubernetes can't add one
        extraConfig: |-
          remote.kubernetes.secret "loki_rules" {
            namespace = "monitoring-system"
            name      = "k8s-monitoring-logs"
          }

          loki.rules.kubernetes "logs" {
            address               = "https://logs-prod-004.grafana.net"
            loki_namespace_prefix = "${CLUSTER_NAME:=bootstrap}"

            rule_selector {
              match_labels = {
                ruler = "loki",
              }
            }

            basic_auth {
              username = convert.nonsensitive(remote.kubernetes.secret.loki_rules.data["username"])
              password = remote.kubernetes.secret.loki_rules.data["password"]
            }
          }
      alloy-logs:
        presets:
          - daemonset
          - filesystem-log-reader
        alloy:
          extraPorts:
            - name: tcplog
              port: 5044
              targetPort: 5044
              protocol: TCP
        # TODO pending https://github.com/grafana/alloy/pull/2701
          stabilityLevel: experimental
        image:
          tag: v1.10.2
        extraConfig: |-
          otelcol.receiver.syslog "syslog" {
            protocol = "rfc3164"
            location = "Australia/Canberra"

            udp {
              listen_address = "0.0.0.0:514"
            }

            output {
              logs = [otelcol.processor.transform.syslog.input]
            }
          }

          otelcol.processor.transform "syslog" {
            error_mode = "silent"

            log_statements {
              context = "log"
              statements = [
                `set(resource.attributes["service.name"], "syslog")`,
              ]
            }

            output {
              logs = [otelcol.exporter.loki.logs.input]
            }
          }

          otelcol.receiver.tcplog "tcplog" {
            listen_address = "0.0.0.0:5044"

            output {
              logs = [otelcol.processor.transform.tcplog.input]
            }
          }

          otelcol.processor.transform "tcplog" {
            error_mode = "silent"

            log_statements {
              context = "log"
              statements = [
                `set(resource.attributes["service.name"], "tcplog")`,
              ]
            }

            output {
              logs = [otelcol.exporter.loki.logs.input]
            }
          }
      alloy-receiver:
        presets:
          - deployment
        alloy:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
