# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://raw.githubusercontent.com/grafana/k8s-monitoring-helm/refs/heads/main/charts/k8s-monitoring/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring-system
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: k8s-monitoring
    namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  uninstall:
    keepHistory: false
  values:
    cluster:
      name: ${CLUSTER_NAME:=bootstrap}
    destinations:
      metrics:
        type: prometheus
        url: https://prometheus-prod-09-prod-au-southeast-0.grafana.net/api/prom/push
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring-metrics
          namespace: monitoring-system
        metricProcessingRules: |-
          write_relabel_config {
            source_labels = ["namespace","pod"]
            separator = "@"
            regex = "flux-system@(.+)-.+-.+"
            target_label = "uid"
            replacement = ""
          }
          write_relabel_config {
            source_labels = ["namespace","pod"]
            separator = "@"
            regex = "flux-system@(.+)-.+-.+"
            target_label = "pod"
            replacement = "$1"
          }
          // previews are tested over HTTP, and every push churns ~45 new series
          write_relabel_config {
            source_labels = ["namespace","pod","deployment","replicaset","owner_name"]
            separator = "@"
            regex = "default@.*-pr-[0-9]+.*"
            action = "drop"
          }
        # an active series limit 429 rejects only the new series, and retrying it stalls every other series
        queueConfig:
          retryOnHttp429: false
        # load PrometheusRule objects into the Grafana Cloud ruler. the sync deletes rule groups
        # under its prefix that it didn't create, so each cluster needs its own prefix. the matcher
        # scopes each cluster's copy of a base rule to that cluster's series.
        # alloy-metrics, since the chart only renders this destination's secret on collectors that
        # write to it. clustered instances elect one leader to sync
        rules:
          enabled: true
          collector: alloy-metrics
          address: https://prometheus-prod-09-prod-au-southeast-0.grafana.net
          mimirNamespacePrefix: ${CLUSTER_NAME:=bootstrap}
          # LogQL rules, loaded by loki.rules.kubernetes below
          labelExpressions:
            - key: ruler
              operator: NotIn
              values:
                - loki
          extraArguments: |-
            external_labels = {"cluster" = "${CLUSTER_NAME:=bootstrap}"}
            extra_query_matchers {
              matcher {
                name       = "cluster"
                match_type = "="
                value      = "${CLUSTER_NAME:=bootstrap}"
              }
            }
      logs:
        type: loki
        url: https://logs-prod-004.grafana.net/loki/api/v1/push
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring-logs
          namespace: monitoring-system
      otlp:
        type: otlp
        url: https://otlp-gateway-prod-au-southeast-0.grafana.net/otlp
        protocol: http
        auth:
          type: basic
        secret:
          create: false
          name: k8s-monitoring
          namespace: monitoring-system

    clusterMetrics:
      enabled: true
      # TODO enable after cluster consolidation, with includeMetrics since control plane sources have no default allowlist
      # controlPlane:
      #   enabled: true
      # kubeProxy:
      #   enabled: true
      kubelet:
        metricsTuning:
          excludeMetrics:
            - kubelet_cgroup_manager_duration_seconds_bucket
            - kubelet_pleg_relist_interval_seconds_bucket
            - kubelet_pod_start_duration_seconds_bucket
      cadvisor:
        metricsTuning:
          # no swap on Talos or OKE
          excludeMetrics:
            - container_memory_swap
      kube-state-metrics:
        # Unknown pod phase is deprecated, and the "true" series already reads 0 for an unknown status
        extraMetricProcessingRules: |-
          rule {
            source_labels = ["__name__","phase","condition","status"]
            separator = "@"
            regex = "kube_pod_status_phase@Unknown@.*|kube_pod_status_ready@.*@unknown@.*|kube_deployment_status_condition@.*@unknown"
            action = "drop"
          }
        metricsTuning:
          excludeMetrics:
            - kube_configmap_.*
            - kube_pod_status_reason
            - kube_replicaset_created
            - kube_replicaset_metadata_generation
            - kube_replicaset_spec_replicas
            - kube_replicaset_status_.*
            - kube_secret_metadata_resource_version
      collector: alloy-metrics
    hostMetrics:
      linuxHosts:
        enabled: true
        # one veth per pod, renamed on every restart, and cAdvisor's container_network_* already covers pods
        extraMetricProcessingRules: |-
          rule {
            source_labels = ["__name__","device"]
            separator = "@"
            regex = "node_network_.+@veth.+"
            action = "drop"
          }
        metricsTuning:
          excludeMetrics:
            - node_cpu_guest_seconds_total
            - node_cpu_scaling_governor
            - node_filesystem_device_error
            - node_filesystem_readonly
      enabled: true
      collector: alloy-metrics
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
      # energy metrics
      # kepler:
      # cost metrics
      # opencost:
    clusterEvents:
      enabled: true
      collector: alloy-singleton
    # journald isn't available on Talos
    # nodeLogs:
    # read /var/log/pods on each node. Streaming via the kubernetes API holds a kubelet
    # inotify instance per container, which exhausted the limit on OKE and replaced
    # pod logs with "failed to create fsnotify watcher: too many open files"
    podLogsViaLoki:
      enabled: true
      collector: alloy-logs
      # stdio MCP servers write JSON-RPC responses to stdout, eg a 22KB tools/list every
      # health check. ~225MB/day, most of the log volume
      extraLogProcessingStages: |-
        stage.match {
          selector            = `{namespace="toolhive-system", container="mcp", stream="stdout"} |~ "^[{]\"(jsonrpc|result)\""`
          action              = "drop"
          drop_counter_reason = "mcp_jsonrpc"
        }
    applicationObservability:
      enabled: true
      receivers:
        otlp:
          grpc:
            enabled: true
          http:
            enabled: true
      traces:
        filters:
          span:
            # toolhive vMCP polls every backend for health and capabilities, ~300k spans/day.
            # real sessions still keep their tools/call spans
            - resource.attributes["k8s.namespace.name"] == "toolhive-system" and IsMatch(attributes["mcp.method.name"], "^(initialize|server/discover|notifications/.*|(tools|prompts|resources|resources/templates)/list)$")
            - resource.attributes["k8s.namespace.name"] == "toolhive-system" and attributes["http.request.method"] == "DELETE" and attributes["url.path"] == "/mcp"
      collector: alloy-receiver
    # eBPF, but we already have OTel
    # autoInstrumentation:
    # just use prom CRDs
    # annotationAutodiscovery:
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
    # 4GB/day but only 50GB/month limit
    # profiling:
    # likely high metrics
    # integrations:
    selfReporting:
      enabled: false
    collectors:
      alloy-metrics:
        presets:
          - clustered
          - statefulset
      alloy-singleton:
        presets:
          - singleton
        # the chart only syncs rules to prometheus destinations. LogQL rules need the cluster
        # matcher written in, since loki.rules.kubernetes can't add one
        extraConfig: |-
          remote.kubernetes.secret "loki_rules" {
            namespace = "monitoring-system"
            name      = "k8s-monitoring-logs"
          }

          loki.rules.kubernetes "logs" {
            address               = "https://logs-prod-004.grafana.net"
            loki_namespace_prefix = "${CLUSTER_NAME:=bootstrap}"

            rule_selector {
              match_labels = {
                ruler = "loki",
              }
            }

            basic_auth {
              username = convert.nonsensitive(remote.kubernetes.secret.loki_rules.data["username"])
              password = remote.kubernetes.secret.loki_rules.data["password"]
            }
          }
      alloy-logs:
        presets:
          - daemonset
          - filesystem-log-reader
        alloy:
          extraPorts:
            - name: tcplog
              port: 5044
              targetPort: 5044
              protocol: TCP
        # TODO pending https://github.com/grafana/alloy/pull/2701
          stabilityLevel: experimental
        image:
          tag: v1.10.2
        extraConfig: |-
          otelcol.receiver.syslog "syslog" {
            protocol = "rfc3164"
            location = "Australia/Canberra"

            udp {
              listen_address = "0.0.0.0:514"
            }

            output {
              logs = [otelcol.processor.transform.syslog.input]
            }
          }

          otelcol.processor.transform "syslog" {
            error_mode = "silent"

            log_statements {
              context = "log"
              statements = [
                `set(resource.attributes["service.name"], "syslog")`,
              ]
            }

            output {
              logs = [otelcol.exporter.loki.logs.input]
            }
          }

          otelcol.receiver.tcplog "tcplog" {
            listen_address = "0.0.0.0:5044"

            output {
              logs = [otelcol.processor.transform.tcplog.input]
            }
          }

          otelcol.processor.transform "tcplog" {
            error_mode = "silent"

            log_statements {
              context = "log"
              statements = [
                `set(resource.attributes["service.name"], "tcplog")`,
              ]
            }

            output {
              logs = [otelcol.exporter.loki.logs.input]
            }
          }
      alloy-receiver:
        presets:
          - deployment
        alloy:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
