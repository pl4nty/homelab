apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: opentelemetry
  namespace: default
spec:
  exporter:
    endpoint: http://k8s-monitoring-alloy-receiver.monitoring-system:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    # low traffic, so keep every trace
    type: parentbased_always_on
  resource:
    # resourceAttributes:
    #   k8s.cluster.name: ${CLUSTER_NAME}
    addK8sUIDAttributes: true
  env:
    # disable due to ingest limits
    # https://opentelemetry.io/docs/reference/specification/sdk-environment-variables/#exporter-selection
    - name: OTEL_METRICS_EXPORTER
      value: none
    # pod stdout already reaches Loki, so OTLP logs would store every line twice
    - name: OTEL_LOGS_EXPORTER
      value: none
  # agent images are pinned because the operator writes its defaults into the CR once, at creation,
  # and never updates them (cluster-1 kept java 1.26.0, nodejs 0.40.0 and dotnet 0.7.0).
  # versions follow the operator's versions.txt.
  # each init container copies its agent into an emptyDir, which counts towards the pod's
  # ephemeral-storage limit, and the default LimitRange gives each container only 100Mi.
  # the pod limit is max(sum of app containers, largest init container), so a 1Gi init
  # container limit lifts the pod to 1Gi without a per-app override. the cpu and memory
  # values are the operator's defaults, which it only fills in when limits/requests are unset
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.33.1@sha256:9f44e319d84bfa1cb9b7f711916a0169e185f5eedee0a8f74cb23affc2953f00
    # java names this field resources, the other languages resourceRequirements
    resources: &agent-resources
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 1Gi
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 100Mi
    env:
      # the 2.x agent exports http/protobuf by default
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://k8s-monitoring-alloy-receiver.monitoring-system:4318
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.82.0@sha256:eec2b930eaf9ae25747f31ee343cbb45e379c49a4d2d31842dfdfc109943155f
    resourceRequirements: *agent-resources
    env:
      # the sdk-node register hook exports http/protobuf by default
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://k8s-monitoring-alloy-receiver.monitoring-system:4318
  python:
    # 0.39b0 had no musl build (hyperglass uses otel-python-platform: musl)
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b2@sha256:f0eb2c59acb53cea7e9bca8d6bf98f813cecb4776ea3129f487e1cf8db2f2adb
    resourceRequirements: *agent-resources
    env:
      # Required if endpoint is set to 4317.
      # Python autoinstrumentation uses http/proto by default
      # so data must be sent to 4318 instead of 4317.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://k8s-monitoring-alloy-receiver.monitoring-system:4318
      - name: OTEL_METRICS_EXPORTER
        value: none
  dotnet:
    # multi-arch since 1.x, so arm64 nodes work without the old custom image
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:1.19.0@sha256:13f03de90e107250f167e38e341114f1a1efb00e5c071ee345962ba5e79d58b1
    resourceRequirements: *agent-resources
    env:
      # Required if endpoint is set to 4317.
      # Dotnet autoinstrumentation uses http/proto by default
      # See https://github.com/open-telemetry/opentelemetry-dotnet-instrumentation/blob/888e2cd216c77d12e56b54ee91dafbc4e7452a52/docs/config.md#otlp
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://k8s-monitoring-alloy-receiver.monitoring-system:4318
  apacheHttpd:
    image: ghcr.io/pl4nty/otel-operator-autoinstrumentation-apache-httpd@sha256:c99d3d2d9eb3da45bb7644943dda9442daf740a2a6dd65405a7b82eed0170a13
  nginx:
    image: ghcr.io/pl4nty/otel-operator-autoinstrumentation-apache-httpd@sha256:c99d3d2d9eb3da45bb7644943dda9442daf740a2a6dd65405a7b82eed0170a13
    attrs:
      - name: NginxModuleTraceAsError
        value: "OFF"
  #   configPath: /etc/php/7.4/apache2/conf.d # HRConvert2
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: opentelemetry-sidecar
  namespace: monitoring-system
spec:
  exporter:
    endpoint: http://localhost:4318
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    # low traffic, so keep every trace
    type: parentbased_always_on
  resource:
    # resourceAttributes:
    #   k8s.cluster.name: ${CLUSTER_NAME}
    addK8sUIDAttributes: true
  env:
    # disable due to ingest limits
    # https://opentelemetry.io/docs/reference/specification/sdk-environment-variables/#exporter-selection
    - name: OTEL_METRICS_EXPORTER
      value: none
  go:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:v0.19.0-alpha@sha256:f43db045cf021ac4a520a5ee9789d0147a63954775d71949264b0e5b34155935
    resourceRequirements:
      limits:
        memory: 320Mi
