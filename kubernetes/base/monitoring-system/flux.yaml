# apiVersion: monitoring.coreos.com/v1
# kind: PodMonitor
# metadata:
#   name: flux-system
#   namespace: flux-system
# spec:
#   podMetricsEndpoints:
#     - port: http-prom
#       relabelings:
#         # https://github.com/prometheus-operator/prometheus-operator/issues/4816
#         - sourceLabels: [__meta_kubernetes_pod_phase]
#           action: keep
#           regex: Running
#   selector:
#     matchExpressions:
#       - key: app
#         operator: In
#         values:
#           - helm-controller
#           - source-controller
#           - kustomize-controller
#           - notification-controller
#           - image-automation-controller
#           - image-reflector-controller
---
# Flux failures from the Kubernetes events in Loki, so they cost no metric series. a recovered
# object stays firing until its events age out of the 1h window
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  namespace: flux-system
  labels:
    ruler: loki
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxReconciliationFailing
          expr: |
            sum by (cluster, namespace, kind, name) (
              count_over_time({source="kubernetes-events", cluster="${CLUSTER_NAME:=bootstrap}", level="Warning"} | logfmt kind | kind=~"Kustomization|HelmRelease|HelmChart|HelmRepository|OCIRepository|GitRepository|Bucket|ImageRepository|ImagePolicy|ImageUpdateAutomation|ResourceSet|ResourceSetInputProvider|FluxInstance" [1h])
            ) >= 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Flux object keeps failing to reconcile.
            description: '{{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} on {{ $labels.cluster }} logged {{ $value }} Warning events in the last hour. Check its events or `flux get all -A --status-selector ready=false`.'
---
# Flux events as spans. a source revision is the root span, and the Kustomizations that apply it are
# its children. no-op reconciles are commit status updates, which the otel provider drops
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: otel
  namespace: flux-system
spec:
  type: otel
  address: http://k8s-monitoring-alloy-receiver.monitoring-system:4318/v1/traces
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux
  namespace: flux-system
spec:
  providerRef:
    name: otel
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: default
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: longhorn
    - kind: HelmRelease
      name: "*"
      namespace: monitoring-system
    - kind: HelmRelease
      name: "*"
      namespace: toolhive-system
