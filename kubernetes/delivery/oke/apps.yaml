# Production for apps/ on this cluster. Each app follows its deploy artifact's
# `main` tag, which CI moves after the image is built, tested and signed.
# Rollback: flux tag artifact oci://ghcr.io/pl4nty/homelab/deploy/<app>:sha-<old> --tag main
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputs:
    - app: hello
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: app-<< inputs.app >>
        namespace: flux-system
      spec:
        interval: 5m
        url: oci://ghcr.io/pl4nty/homelab/deploy/<< inputs.app >>
        ref:
          tag: main
        verify:
          provider: cosign
          matchOIDCIdentity:
            - issuer: ^https://token\.actions\.githubusercontent\.com$
              subject: ^https://github\.com/pl4nty/homelab/\.github/workflows/apps\.yaml@refs/heads/main$
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: app-<< inputs.app >>
        namespace: flux-system
      spec:
        interval: 30m
        prune: true
        wait: false
        sourceRef:
          kind: OCIRepository
          name: app-<< inputs.app >>
        path: ./
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        postBuild:
          substituteFrom:
            - kind: ConfigMap
              name: cluster-settings
            - kind: Secret
              name: cluster-secrets
            - kind: ConfigMap
              name: instance-settings
