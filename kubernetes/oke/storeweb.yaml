# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storeweb${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        pod:
          annotations:
            instrumentation.opentelemetry.io/inject-dotnet: "true"
            # operator maps linux-musl-x64 to the image's arch-agnostic linux-musl dir, so this also covers arm64
            instrumentation.opentelemetry.io/otel-dotnet-auto-runtime: "linux-musl-x64"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/storeweb
              tag: ${APP_IMAGE_TAG:=}
            env:
              OTEL_DOTNET_EXPERIMENTAL_HTTPCLIENT_DISABLE_URL_QUERY_REDACTION: "true"
              # temporary: surface .NET auto-instrumentation diagnostics in Loki (arm64 test)
              OTEL_DOTNET_AUTO_LOGGER: console
              OTEL_LOG_LEVEL: debug
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    persistence:
      config:
        type: secret
        name: storeweb
        globalMounts:
          - path: /app/appsettings.json
            subPath: appsettings.json
    route:
      main:
        enabled: true
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - msft-store${APP_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 80
