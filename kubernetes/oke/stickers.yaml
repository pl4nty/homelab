# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stickers
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/stickers
              tag: ${APP_IMAGE_TAG}
            env:
              PUBLIC_URL: https://stickers${APP_HOST_SUFFIX:=}.${PUBLIC_DOMAIN}
            envFrom:
              - secretRef:
                  name: stickers
                  optional: true
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - stickers${APP_HOST_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: stickers
                port: 8000
