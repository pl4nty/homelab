# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anudegreeapp${APP_SUFFIX:=}
  namespace: default
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: ${APP_SSA:=Ignore}
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
        # doesn't match required OTel path
        # pod:
        #   annotations:
        #     instrumentation.opentelemetry.io/inject-apache-httpd: "true"
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/anudegreeapp
              tag: ${APP_IMAGE_TAG:=}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
      getdata:
        type: cronjob
        cronjob:
          schedule: "0 */12 * * *"
        containers:
          main:
            image:
              repository: quay.io/curl/curl
              tag: 8.21.0
            command:
              - curl
              - anudegreeapp/scraper/plan_scraper.php
              - "&&"
              - curl
              - anudegreeapp/scraper/subplan_scraper.php
              - "&&"
              - curl
              - anudegreeapp/scraper/course_scraper.php
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - degree-planner${APP_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - identifier: main
                port: 80
