apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: apps
  namespace: flux-system
spec:
  inputs:
    - app: stickers
      production: false
    - app: whisker-shuffle
      production: true
    - app: winget-restsource
      production: true
  resourcesTemplate: |
    apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSetInputProvider
    metadata:
      name: << inputs.app >>-previews
      namespace: flux-system
      labels:
        homelab.tplant.com.au/previews: "true"
      annotations:
        fluxcd.controlplane.io/reconcileEvery: 2m
    spec:
      type: OCIArtifactTag
      url: oci://ghcr.io/pl4nty/homelab/<< inputs.app >>
      filter:
        includeTag: ^pr-[0-9]+$
      defaultValues:
        app: << inputs.app >>
    <<- if inputs.production >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: << inputs.app >>
      namespace: flux-system
    spec:
      interval: 5m
      url: oci://ghcr.io/pl4nty/homelab/<< inputs.app >>
      ref:
        tag: main
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.app >>
      namespace: flux-system
    spec:
      interval: 30m
      prune: true
      sourceRef:
        kind: OCIRepository
        name: << inputs.app >>
      path: ./
      postBuild:
        substituteFrom:
          - kind: ConfigMap
            name: cluster-settings
          - kind: ConfigMap
            name: instance-settings
    <<- end >>
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: previews
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      selector:
        matchLabels:
          homelab.tplant.com.au/previews: "true"
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.app >>-<< inputs.tag >>
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.app >>-<< inputs.tag >>
        namespace: flux-system
      spec:
        interval: 10m
        url: oci://ghcr.io/pl4nty/homelab/<< inputs.app >>
        ref:
          digest: "<< inputs.digest >>"
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.app >>-<< inputs.tag >>
        namespace: flux-system
      spec:
        interval: 30m
        timeout: 5m
        prune: true
        wait: true
        targetNamespace: << inputs.app >>-<< inputs.tag >>
        sourceRef:
          kind: OCIRepository
          name: << inputs.app >>-<< inputs.tag >>
        path: ./
        postBuild:
          substitute:
            APP_HOST_SUFFIX: "-<< inputs.tag >>"
          substituteFrom:
            - kind: ConfigMap
              name: cluster-settings
            - kind: ConfigMap
              name: instance-settings
