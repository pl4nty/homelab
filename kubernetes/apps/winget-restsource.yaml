# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: winget-restsource
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: default
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/pl4nty/winget-restsource
              tag: ${APP_IMAGE_TAG}
            env:
              RestSource__PublicBaseUrl: https://winget-restsource${APP_HOST_SUFFIX:=}.${PUBLIC_DOMAIN}
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          - winget-restsource${APP_HOST_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: winget-restsource
                port: 8080
