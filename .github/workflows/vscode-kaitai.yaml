name: vscode-kaitai

# Packages the Kaitai IDE extension on PRs (downloadable .vsix artifact) and publishes it from main with
# Trusted Publishing (OIDC, no stored secrets) to the Visual Studio Marketplace and Open VSX. A version that is
# already on a registry is skipped, so bump apps/vscode-kaitai/package.json "version" to release.
#
# Registry setup: a Trusted Publishing policy for pl4nty/homelab, workflow vscode-kaitai.yaml, environment
# vscode-marketplace, on the Marketplace publisher pl4nty and on the Open VSX extension pl4nty.kaitai-ide.
# Open VSX only trusts extensions that already exist, so its first version is published with the OVSX_PAT
# secret, which can be deleted afterwards.
on:
  pull_request:
    paths: [apps/vscode-kaitai/**, .github/workflows/vscode-kaitai.yaml]
  push:
    branches: [main]
    paths: [apps/vscode-kaitai/**, .github/workflows/vscode-kaitai.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-kaitai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/vscode-kaitai

jobs:
  package:
    runs-on: ubuntu-latest
    container: node:24-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx --yes @vscode/vsce@3 package --out kaitai-ide.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaitai-ide-vsix
          path: apps/vscode-kaitai/kaitai-ide.vsix

  publish:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: node:24-slim
    # the registries' policies pin this environment; restrict it to main in the repo settings
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run build
      - run: npx --yes @vscode/vsce@3 package --out kaitai-ide.vsix
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath kaitai-ide.vsix --oidc --skip-duplicate
      - name: Publish to Open VSX
        env:
          # only for the first version; trusted publishing needs the extension to exist
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then npx --yes ovsx@0 publish kaitai-ide.vsix --skip-duplicate
          else npx --yes ovsx@0 publish kaitai-ide.vsix --trusted-publishing --skip-duplicate; fi
