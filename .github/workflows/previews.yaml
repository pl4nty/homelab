name: previews

# Removes preview artifacts for closed PRs. Flux Operator's OCIArtifactTag provider
# then drops the input, and the preview ResourceSet prunes the preview namespace.
# The daily run catches any delete that failed when the PR closed.
# Needs the homelab/previews package to give this repository the Admin role
# (package settings > Manage Actions access), or GITHUB_TOKEN can't delete versions.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE: /users/${{ github.repository_owner }}/packages/container/homelab%2Fpreviews
      CLOSED_PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          versions=$(gh api --paginate "$PACKAGE/versions" \
            --jq '.[] | {id, tag: (.metadata.container.tags[] | select(test("^pr-[0-9]+$")))} | "\(.id) \(.tag)"' \
            2>/dev/null) || { echo "no preview package yet"; exit 0; }
          while read -r id tag; do
            [[ -n $id ]] || continue
            pr=${tag#pr-}
            if [[ -n $CLOSED_PR ]]; then
              [[ $pr == "$CLOSED_PR" ]] || continue
            else
              state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state)
              [[ $state == closed ]] || continue
            fi
            echo "deleting $tag (version $id)"
            gh api -X DELETE "$PACKAGE/versions/$id"
          done <<<"$versions"
