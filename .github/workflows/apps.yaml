name: apps

# Builds each changed app under apps/ and publishes its deploy/ folder as a signed
# OCI artifact at the same path, ghcr.io/pl4nty/homelab/apps/<app>, tagged pr-<n> for previews or
# main for production. Closing a PR deletes its pr-<n> tags. See docs/apps-monorepo.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # fork PRs get a read-only token, so they build but never publish
  PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
  ARTIFACT_TAG: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: apps/*/**
          dir_names: true
          dir_names_max_depth: 2
          matrix: true

  app:
    needs: changes
    if: needs.changes.outputs.apps != '[]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lint Dockerfile
        if: hashFiles(format('{0}/Dockerfile', matrix.app)) != ''
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          call: check
          vars: APP=${{ matrix.app }}

      - name: Build, test and push
        if: hashFiles(format('{0}/Dockerfile', matrix.app)) != ''
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          push: ${{ env.PUBLISH }}
          vars: |
            APP=${{ matrix.app }}
            TAG=${{ env.IMAGE_TAG }}
            CACHE_TO=${{ github.event_name == 'push' }}

      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        if: env.PUBLISH == 'true' && hashFiles(format('{0}/deploy/**', matrix.app)) != ''
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true' && hashFiles(format('{0}/deploy/**', matrix.app)) != ''

      - name: Publish deploy artifact
        if: env.PUBLISH == 'true' && hashFiles(format('{0}/deploy/**', matrix.app)) != ''
        env:
          # previews never get production secrets
          IGNORE: ${{ github.event_name == 'pull_request' && '*.sops.yaml' || '' }}
        run: |
          find "$APP/deploy" -name '*.yaml' -exec sed -i "s/\${APP_IMAGE_TAG}/$IMAGE_TAG/g" {} +
          url=ghcr.io/${{ github.repository_owner }}/homelab/$APP
          digest=$(flux push artifact "oci://$url:$ARTIFACT_TAG" --path="$APP/deploy" --ignore-paths="$IGNORE" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$GITHUB_REF@sha1:$GITHUB_SHA" -o json | jq -r .digest)
          cosign sign --yes "$url@$digest"

  cleanup:
    needs: changes
    if: github.event.action == 'closed' && needs.changes.outputs.apps != '[]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    steps:
      # the preview ResourceSet prunes a preview once its tag is gone
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: homelab/${{ matrix.app }}
          delete-tags: ${{ env.ARTIFACT_TAG }}
          delete-orphaned-images: true

  # the only required check: always reports, even when nothing changed
  ci-ok:
    needs: [changes, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: app
