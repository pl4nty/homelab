name: apps

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
  TAG: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        working-directory: apps
        run: |
          # only the OKE manifest ships with the app; cluster-1 manifests take Renovate digest bumps of our own images, so rebuilding on them loops
          for app in */; do
            git diff --quiet "$BASE...$COMMIT" -- "$app" "../kubernetes/oke/${app%/}.yaml" || echo "${app%/}"
          done | jq -Rnr '"apps=\([inputs])"' >> "$GITHUB_OUTPUT"

  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          # changed files only, so apps are formatted one PR at a time
          extra-args: --from-ref ${{ github.event.pull_request.base.sha || github.event.before }} --to-ref ${{ env.COMMIT }}

  app:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    environment:
      name: ${{ matrix.app }}${{ github.event.pull_request && '-preview' || '' }}
      url: ${{ steps.publish.outputs.url }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        # bldr frontends (Pkgfile) don't implement the check subrequest
        if: ${{ !hashFiles(format('apps/{0}/Pkgfile', matrix.app)) }}
        env: &git-auth
          # BuildKit reads it to fetch private git contexts
          GIT_AUTH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        with:
          source: .
          files: &bake-files |
            apps/docker-bake.hcl
            ${{ hashFiles(format('apps/{0}/docker-bake.hcl', matrix.app)) && format('apps/{0}/docker-bake.hcl', matrix.app) }}
          call: check
          set: &secrets default.secrets=type=env,id=GIT_AUTH_TOKEN
          vars: APP=${{ matrix.app }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env: *git-auth
        with:
          source: .
          files: *bake-files
          set: *secrets
          push: ${{ env.PUBLISH }}
          vars: |
            APP=${{ matrix.app }}
            TAG=sha-${{ env.COMMIT }}
            LATEST=${{ github.event_name == 'push' }}
            CACHE_TO=${{ github.event_name == 'push' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' && hashFiles('dist/**')
        with:
          name: ${{ matrix.app }}
          path: dist/
      - if: github.event_name == 'push' && hashFiles('dist/**')
        env:
          GH_TOKEN: ${{ github.token }}
        # tag main's head: GITHUB_TOKEN can't tag a commit whose workflows differ from it
        run: gh release create "$APP/sha-$COMMIT" dist/* --target "$GITHUB_REF_NAME" --title "$APP" --latest=false
      # only cluster-oke runs the apps ResourceSet; other clusters git-sync their manifests
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        if: &manifest env.PUBLISH == 'true' && hashFiles(format('kubernetes/oke/{0}.yaml', matrix.app))
      - id: publish
        if: *manifest
        env:
          APP_SUFFIX: ${{ github.event.pull_request && format('-{0}', env.TAG) || '' }}
          PUBLIC_DOMAIN: tplant.com.au
        run: |
          sed -i "s/\${APP_IMAGE_TAG:=}/sha-$COMMIT/" kubernetes/oke/"$APP".yaml
          flux push artifact "oci://ghcr.io/$GITHUB_REPOSITORY/apps:$APP.$TAG" --path kubernetes/oke/"$APP".yaml \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$TAG@sha1:$COMMIT"
          yq '.. | select(tag == "!!map") | select(has("hostnames")) | "url=https://" + (.hostnames[0] | envsubst)' kubernetes/oke/"$APP".yaml >> "$GITHUB_OUTPUT"

  # every app any push published, since the final diff can drop an app that still has a preview
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: homelab/apps
          delete-tags: '*.${{ env.TAG }}'

  ci-ok:
    needs: [changes, lint, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, app
