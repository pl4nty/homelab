name: apps

# Builds, tests and delivers the apps under apps/. See docs/apps-monorepo.md.
# - PRs: lint and test each changed app, push its image as pr-<n>, then push one
#   signed preview artifact (ghcr.io/pl4nty/homelab/previews:pr-<n>) that Flux
#   Operator deploys as a preview.
# - main: push images as sha-<sha> and latest, and one signed deploy artifact per
#   app (ghcr.io/pl4nty/homelab/deploy/<app>:main) that production follows.
# No paths filter: the `changes` job is cheap, and `ci-ok` must always report so it
# can be the only required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: App folder names as a JSON array, for example ["hello"]
        type: string

permissions:
  contents: read

concurrency:
  group: apps-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # fork PRs get a read-only token, so they test but never publish
  PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: apps
        env:
          INPUT_APPS: ${{ inputs.apps }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n $INPUT_APPS ]]; then
            apps=$(jq -c . <<<"$INPUT_APPS")
          else
            apps=$(.github/scripts/changed-apps.sh "$BASE" HEAD)
          fi
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images and deploy artifacts
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect app
        id: app
        run: |
          dir=apps/$APP
          # submodule apps keep upstream source in apps/<app>/<submodule>
          if git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | grep -q " $dir/"; then
            git submodule update --init --depth 1 -- "$dir"
          fi
          echo "image=$([[ -f $dir/Dockerfile ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "test=$(grep -qiE '^FROM\s.+\sAS\s+test\s*$' "$dir/Dockerfile" 2>/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "platforms=$(cat "$dir/PLATFORMS" 2>/dev/null || echo linux/amd64,linux/arm64)" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            echo "tags=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=sha-${GITHUB_SHA::7},latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.app.outputs.image == 'true' && contains(steps.app.outputs.platforms, 'arm')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.app.outputs.image == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lint Dockerfile
        if: steps.app.outputs.image == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image
          call: check
          vars: |
            APP=${{ matrix.app }}

      - name: Test
        if: steps.app.outputs.test == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: test
          vars: |
            APP=${{ matrix.app }}

      - name: Build and push image
        id: build
        if: steps.app.outputs.image == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image
          push: ${{ env.PUBLISH }}
          vars: |
            APP=${{ matrix.app }}
            TAGS=${{ steps.app.outputs.tags }}
            PLATFORMS=${{ steps.app.outputs.platforms }}
            CACHE_TO=${{ github.event_name != 'pull_request' }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign image
        id: image
        if: steps.app.outputs.image == 'true'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
        run: |
          digest=$(jq -r '.image["containerimage.digest"] // empty' <<<"$METADATA")
          echo "repository=$REGISTRY/$APP" >> "$GITHUB_OUTPUT"
          # sha-<full sha> is cut to the 7 characters the image was tagged with
          [[ $TAG == sha-* ]] && TAG=${TAG::11}
          # unpublished builds (fork PRs) have no digest, so the tag stands alone
          echo "tag=$TAG${digest:+@$digest}" >> "$GITHUB_OUTPUT"
          if [[ $PUBLISH == true && -n $digest ]]; then
            cosign sign --yes "$REGISTRY/$APP@$digest"
          fi

      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        if: hashFiles(format('apps/{0}/deploy/**', matrix.app)) != ''

      - name: Render and validate deploy
        id: deploy
        if: hashFiles(format('apps/{0}/deploy/**', matrix.app)) != ''
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          .github/scripts/render-deploy.sh "$APP" rendered "$MODE" "$REPOSITORY" "$IMAGE_TAG"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'kustomization\.ya?ml$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "rendered/$APP"
          echo "rendered=true" >> "$GITHUB_OUTPUT"

      - name: Push production deploy artifact
        if: steps.deploy.outputs.rendered == 'true' && github.event_name != 'pull_request'
        run: |
          url=oci://$REGISTRY/homelab/deploy/$APP
          digest=$(flux push artifact "$url:sha-${GITHUB_SHA::7}" \
            --path="rendered/$APP" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="$GITHUB_REF_NAME@sha1:$GITHUB_SHA" \
            --output json | jq -r .digest)
          cosign sign --yes "${url#oci://}@$digest"
          flux tag artifact "$url:sha-${GITHUB_SHA::7}" --tag main

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.deploy.outputs.rendered == 'true' && github.event_name == 'pull_request'
        with:
          name: deploy-${{ matrix.app }}
          path: rendered/
          retention-days: 1

  preview:
    needs: app
    # bots (Renovate) get tests but no preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # image-only apps upload nothing
        continue-on-error: true
        with:
          pattern: deploy-*
          path: rendered
          merge-multiple: true
      - id: any
        run: echo "found=$([[ -n $(ls -A rendered 2>/dev/null) ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        if: steps.any.outputs.found == 'true'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.any.outputs.found == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.any.outputs.found == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push preview artifact
        if: steps.any.outputs.found == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # one artifact per PR holding every changed app, each in its own folder
          url=oci://$REGISTRY/homelab/previews
          digest=$(flux push artifact "$url:pr-$PR" \
            --path=rendered \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR" \
            --revision="$HEAD_REF@sha1:$HEAD_SHA" \
            --output json | jq -r .digest)
          cosign sign --yes "${url#oci://}@$digest"
          echo "Preview pr-$PR: $(ls rendered | sed 's/$/-pr-'"$PR"'/' | paste -sd ' ')" >> "$GITHUB_STEP_SUMMARY"

  # the only required check: path-skipped jobs report success instead of pending
  ci-ok:
    needs: [changes, app, preview]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ ! $RESULTS =~ failure|cancelled ]]
