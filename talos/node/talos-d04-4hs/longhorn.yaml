# Longhorn's default disk, symlinked from node/talos-uj3-t5w/. In Talos rather than set by hand, so it
# survives a node re-registering
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node.longhorn.io/create-default-disk: config
annotations:
  node.longhorn.io/default-disks-config: '[{"path":"/dev/nvme0n1","allowScheduling":true,"diskType":"block"}]'
