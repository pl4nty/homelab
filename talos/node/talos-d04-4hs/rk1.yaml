# OS on eMMC, Longhorn on NVMe
machine:
  install:
    diskSelector:
      size: <= 100GB
    extraKernelArgs:
      - talos.logging.kernel=tcp://192.168.1.131:30544
  disks:
    - device: /dev/nvme0n1
      partitions:
        - mountpoint: /var/mnt/nvme0n1
  sysctls:
    # cnpg pods request 100Mi hugepages-2Mi each
    vm.nr_hugepages: "256"
