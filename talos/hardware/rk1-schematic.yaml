# Turing RK1. Built by talos/docker-bake.hcl, since Image Factory only builds official extensions
overlay:
  image: ghcr.io/siderolabs/sbc-rockchip:v0.2.1@sha256:9ce1d1d2ca1c0866bafd9728bd12eb0ef70b386318b033db2c841ce35e33b882
  name: turingrk1
customization:
  extraKernelArgs:
    # rockchip-mpp isn't signed with the Talos key
    - -module.sig_enforce
    # rockchip-mpp's rknpu drives the NPU for librknnrt, and rockchip-rknn's rocket binds it first
    - module_blacklist=rocket
  systemExtensions:
    # digests from ghcr.io/siderolabs/extensions:v<talosVersion>: Sidero re-pushes tags for newer Talos releases
    officialExtensions:
      - ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:584e1d106e424d3e17ddd43bddf892b386748f10d11a9fd024a358f0d42c0a2e
      - ghcr.io/siderolabs/nut-client:2.8.5@sha256:075e39d4c837ba07bdd97d7cd9aee444e5fe0d17515ee15dd07851827f117802
      - ghcr.io/siderolabs/panfrost:20261019-v1.14.6@sha256:8f9ac937767bcc9424335107c20aad474333522a47bee13b3b4ad552558ffbf5
      - ghcr.io/siderolabs/rockchip-rknn:v1.14.6@sha256:3751f733b864ba7aadfe1194e94f8f964b4498b8207fb3aa7e0a16f4d15879d1
      - ghcr.io/siderolabs/util-linux-tools:2.42.2@sha256:f93f23e96b28e00228cf9a006a15c1648bd5975be989adb1bee6c05c046001a1
      # built for one Talos kernel, so rebuild it with talosVersion. Its digest is in the
      # schematic ID, so a rebuild gets a new installer
      - ghcr.io/pl4nty/talos-rockchip-mpp:sha-146139e1fe885a4aa04377dc306aa9ed52204900@sha256:c31c0c3034d26d0976c2f1acee66edae50cbd8a14a56ae5d7e8fc948719014f7
