# An RK1 that has been reset into a control plane: OS on eMMC, EPHEMERAL (and etcd under it) and
# Longhorn on NVMe. Talos only places EPHEMERAL when it provisions a node, so a node only points
# here as part of its reset. Folds into control-plane/ once every RK1 has moved (homelab#1506).
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.size <= 100u * GB
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  maxSize: 128GiB
  # grows into free space after it if maxSize is raised, but Longhorn's partition follows it
  grow: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
# mounts at /var/mnt/nvme0n1, the path Longhorn disk-1 already uses
name: nvme0n1
provisioning:
  diskSelector:
    match: disk.transport == "nvme"
  minSize: 100GiB
  grow: true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  # cnpg pods request 100Mi hugepages-2Mi each
  vm.nr_hugepages: "256"
---
# control-plane/vip.yaml has the NUC's eno1
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.1.200
link: end0
