# The Intel NUC (talos-ivx-yqq). Symlinked from node/talos-ivx-yqq/, since talos-oci-a1 is a worker too
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
---
# Talos doesn't autoload these extension modules
apiVersion: v1alpha1
kind: KernelModuleConfig
name: snd_hda_intel
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: thunderbolt
---
# the iGPU's HDMI audio codec
apiVersion: v1alpha1
kind: KernelModuleConfig
name: snd_hda_codec_intelhdmi
