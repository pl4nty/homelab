# Oracle Cloud VM.Standard.A1.Flex (arm64), created by ../oracle.sh and reached over KubeSpan.
# The node folder sets the provider ID and topology labels from
# talosctl get platformmetadata
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # the paravirtualized boot volume; worker/nuc.yaml's NVMe path doesn't exist here
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  # soft: pods default to the home nodes (where Longhorn is) and only land on Oracle nodes if they tolerate
  # topology.kubernetes.io/region (any value, so it suits every region) or nothing else fits. Set at
  # registration, since NodeRestriction stops workers changing their own taints later
  register-with-taints: topology.kubernetes.io/region:PreferNoSchedule
---
# the OCI CSI driver waits for /dev/oracleoci/oraclevd<x>, which Oracle Linux's udev rules create
# from the paravirtualized SCSI LUN (1 is the boot volume, so attachments start at b)
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:2", SYMLINK+="oracleoci/oraclevdb"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:3", SYMLINK+="oracleoci/oraclevdc"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:4", SYMLINK+="oracleoci/oraclevdd"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:5", SYMLINK+="oracleoci/oraclevde"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:6", SYMLINK+="oracleoci/oraclevdf"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:7", SYMLINK+="oracleoci/oraclevdg"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:8", SYMLINK+="oracleoci/oraclevdh"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:9", SYMLINK+="oracleoci/oraclevdi"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:10", SYMLINK+="oracleoci/oraclevdj"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:11", SYMLINK+="oracleoci/oraclevdk"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:12", SYMLINK+="oracleoci/oraclevdl"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:13", SYMLINK+="oracleoci/oraclevdm"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:14", SYMLINK+="oracleoci/oraclevdn"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:15", SYMLINK+="oracleoci/oraclevdo"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:16", SYMLINK+="oracleoci/oraclevdp"
  - KERNEL=="sd*", ENV{DEVTYPE}=="disk", ENV{ID_PATH}=="*-scsi-0:0:0:17", SYMLINK+="oracleoci/oraclevdq"
