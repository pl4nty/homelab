# Oracle Cloud VM.Standard.A1.Flex (arm64), created by ../oracle.sh and reached over KubeSpan.
# The OCI cloud controller (kubernetes/cluster-1/system/oci-cloud-controller-manager) initialises it and sets
# the well-known topology.kubernetes.io/region and zone labels
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # the paravirtualized boot volume; worker/nuc.yaml's NVMe path doesn't exist here
    match: disk.dev_path == "/dev/sda"
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  # only this node is cloud-managed, so set it here rather than cluster.externalCloudProvider
  cloud-provider: external
  # soft: pods default to the home nodes (where Longhorn is) and only land here if they ask for
  # topology.kubernetes.io/region=ap-sydney-1 or nothing else fits. Set at registration, since NodeRestriction
  # stops workers changing their own taints later
  register-with-taints: topology.kubernetes.io/region=ap-sydney-1:PreferNoSchedule
