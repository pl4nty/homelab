# alloy-logs NodePort, see kubernetes/base/monitoring-system/k8s-monitoring-services.yaml
machine:
  logging:
    destinations:
      - endpoint: tcp://192.168.1.131:30544
        format: json_lines
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: alloy
url: tcp://192.168.1.131:30544/
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
  rotate-server-certificates: "true"
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  vm.nr_hugepages: "0"
---
# on by default for new 1.14 clusters. Longhorn needs host iscsiadm, untested inside the sandbox
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h
---
# dual stack. The IPv6 ranges are from a random ULA prefix (fd11:bb51:15bd::/48), so flannel masquerades
# pod traffic to the node's own address and an ISP prefix change doesn't touch them.
# Nodes only get pod CIDRs when they register, so a node gets its IPv6 one when it re-registers
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.244.0.0/16
  - fd11:bb51:15bd::/56
serviceSubnets:
  - 10.96.0.0/12
  - fd11:bb51:15bd:100::/112
