# alloy-logs NodePort, see kubernetes/base/monitoring-system/k8s-monitoring-services.yaml
machine:
  logging:
    destinations:
      - endpoint: tcp://192.168.1.131:30544
        format: json_lines
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
  sysctls:
    vm.nr_hugepages: "0"
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: alloy
url: tcp://192.168.1.131:30544/
