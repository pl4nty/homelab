apiVersion: v1alpha1
kind: KubeletConfig
config:
  # etcd isn't in kubelet accounting. This replaces all Talos defaults, so keep the other keys
  systemReserved:
    cpu: 50m
    memory: 1Gi
    pid: "100"
    ephemeral-storage: 256Mi
---
apiVersion: v1alpha1
kind: KubeProxyConfig
mode: nftables
image: quay.io/k0sproject/kube-proxy:v1.37.2@sha256:b24d9f8b5e0265ac14fb532856e84af957eae2fb8fd38f8240c42b76e76e09a7
---
# for kubernetes/cluster-1/backups/etcd.yaml
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles: [os:etcd:backup]
allowedKubernetesNamespaces: [default]
---
# allow scheduling on control planes
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  resolveMemberNames: true
---
# drop the default LB-exclusion label (kube-vip announces Services from control planes), keep the role label
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  $patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node-role.kubernetes.io/control-plane: ""
---
# the endpoint moved from the NUC's address to the VIP, which also moved the token issuer.
# Keep accepting tokens from the old issuer until every projected token has been refreshed
apiVersion: v1alpha1
kind: KubeServiceAccountConfig
accepted:
  issuers:
    - https://192.168.1.131:6443
  # those tokens also carry the old issuer as their audience
  audiences:
    - https://192.168.1.200:6443
    - https://192.168.1.131:6443
---
# metrics for k8s-monitoring's control plane scrape (kubernetes/base/monitoring-system/k8s-monitoring.yaml).
# Talos binds both to localhost. the secure ports still need a token allowed to GET /metrics
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# etcd has no 1.14 document yet. plain HTTP, metrics and /health only
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
