// https://github.com/JPro-one/HelloJPro/blob/main/build.gradle
/**
 ******************  Script Configuration ******************
 */
buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()

    maven {
      url "https://sandec.jfrog.io/artifactory/repo"
    }
  }

  dependencies {
    // restart button is very broken
    // >=2020.1.5 dragging elements fails in Firefox
    // >=2022.1 requires gradle 7
    // >=2022.1.2 supports ARM
    // 2022.1.5-2023.1.0 breaks start click button: Group@6ccef66[styleClass=root]is already set as root of another scene
    classpath 'com.sandec.jpro:jpro-plugin-gradle:2022.1.4'
  }
}

/**
 ******************  Java Configuration ******************
 */
plugins {
  // javafxplugin 0.1.0 no longer applies the java plugin, and sourceSets below needs it first
  id 'java'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

sourceSets {
  main {
    java {
      srcDir 'src'
    }
    resources {
      srcDir 'src'
    }
  }
}

compileJava {
  sourceCompatibility = 17
  targetCompatibility = 17
}

repositories {
  mavenCentral()
}

javafx {
  version = '17.0.7'
  modules = [ 'javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.media', 'javafx.swing', 'javafx.web' ]
}

/**
 ******************  jpro Configuration ******************
 */
apply plugin: 'com.sandec.jpro'

/**
 * App Main Class
 */
mainClassName = 'comp1140.ass2.gui.Board'

/**
 * jpro settings
 */
jpro {
  JVMArgs << '-Xmx1000m'

  // jpro server port
  port = 8080
}

// javafxplugin 0.1.0 only sets platform attributes on its own configurations, so jpro's
// boot classpath can't pick a variant of the javafx modules. Reuse runtimeClasspath's
configurations.named('jproboot') {
  attributes { attrs ->
    def runtime = configurations.runtimeClasspath.attributes
    runtime.keySet().each { key -> attrs.attributeProvider(key, provider { runtime.getAttribute(key) }) }
  }
}
