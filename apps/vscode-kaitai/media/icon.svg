<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Kaitai Struct IDE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- byte grid: 6 columns x 6 rows, parsed fields highlighted -->
  <g transform="translate(34 34)">
    <g fill="#33415c">
      <rect x="0" y="0" width="26" height="26" rx="6"/><rect x="32" y="0" width="26" height="26" rx="6"/>
      <rect x="64" y="0" width="26" height="26" rx="6"/><rect x="96" y="0" width="26" height="26" rx="6"/>
      <rect x="128" y="0" width="26" height="26" rx="6"/><rect x="160" y="0" width="26" height="26" rx="6"/>
      <rect x="0" y="32" width="26" height="26" rx="6"/><rect x="32" y="32" width="26" height="26" rx="6"/>
      <rect x="64" y="32" width="26" height="26" rx="6"/><rect x="96" y="32" width="26" height="26" rx="6"/>
      <rect x="128" y="32" width="26" height="26" rx="6"/><rect x="160" y="32" width="26" height="26" rx="6"/>
      <rect x="0" y="64" width="26" height="26" rx="6"/><rect x="32" y="64" width="26" height="26" rx="6"/>
      <rect x="64" y="64" width="26" height="26" rx="6"/><rect x="96" y="64" width="26" height="26" rx="6"/>
      <rect x="128" y="64" width="26" height="26" rx="6"/><rect x="160" y="64" width="26" height="26" rx="6"/>
      <rect x="0" y="96" width="26" height="26" rx="6"/><rect x="32" y="96" width="26" height="26" rx="6"/>
      <rect x="64" y="96" width="26" height="26" rx="6"/><rect x="96" y="96" width="26" height="26" rx="6"/>
      <rect x="128" y="96" width="26" height="26" rx="6"/><rect x="160" y="96" width="26" height="26" rx="6"/>
      <rect x="0" y="128" width="26" height="26" rx="6"/><rect x="32" y="128" width="26" height="26" rx="6"/>
      <rect x="64" y="128" width="26" height="26" rx="6"/><rect x="96" y="128" width="26" height="26" rx="6"/>
      <rect x="128" y="128" width="26" height="26" rx="6"/><rect x="160" y="128" width="26" height="26" rx="6"/>
      <rect x="0" y="160" width="26" height="26" rx="6"/><rect x="32" y="160" width="26" height="26" rx="6"/>
      <rect x="64" y="160" width="26" height="26" rx="6"/><rect x="96" y="160" width="26" height="26" rx="6"/>
      <rect x="128" y="160" width="26" height="26" rx="6"/><rect x="160" y="160" width="26" height="26" rx="6"/>
    </g>
    <!-- fields: magic (4 bytes), u2, u4 spanning rows, bytes -->
    <rect x="0" y="0" width="122" height="26" rx="6" fill="#f2a33a"/>
    <rect x="128" y="0" width="58" height="26" rx="6" fill="#4fc3f7"/>
    <rect x="0" y="32" width="90" height="26" rx="6" fill="#7bd88f"/>
    <rect x="96" y="32" width="90" height="26" rx="6" fill="#c792ea"/>
    <rect x="0" y="64" width="90" height="26" rx="6" fill="#c792ea"/>
    <rect x="32" y="96" width="122" height="26" rx="6" fill="#ff6e6e"/>
  </g>
</svg>
