# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hello
  namespace: default
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    # explicit, because previews run in their own namespace
    namespace: default
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        containers:
          main:
            image:
              # filled in by CI with the image it just built
              repository: ${APP_IMAGE_REPOSITORY}
              tag: ${APP_IMAGE_TAG}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - namespace: default
            name: ${CLUSTER_NAME}
        hostnames:
          # previews set APP_HOST_SUFFIX to -pr-<n>; one level deep for Universal SSL
          - hello${APP_HOST_SUFFIX:=}.${PUBLIC_DOMAIN}
        rules:
          - backendRefs:
              - name: hello
                port: 8080
