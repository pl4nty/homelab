[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickersplit"
version = "0.3.0"
description = "A sticker catalogue: upload scans, review Claude-tagged stickers, approve, browse."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tom Plant" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "anthropic>=2.3",
  "pydantic>=2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
stickers = "stickersplit.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
