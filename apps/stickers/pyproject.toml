[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickersplit"
version = "0.3.0"
description = "A sticker catalogue: upload scans, review Claude-tagged stickers, approve, browse."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Tom Plant" }]
dependencies = [
  "numpy==2.5.5",
  "opencv-python-headless==5.1.0.95",
  "pillow==13.0.0",
  "anthropic==2.11.0",
  "pydantic==2.14.4",
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.34",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
stickers = "stickersplit.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
