[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stickersplit"
version = "0.3.0"
description = "A sticker catalogue: upload scans, review Claude-tagged stickers, approve, browse."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tom Plant" }]
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==5.0.0.93",
  "pillow>=10",
  "anthropic==2.3.0",
  "pydantic==2.14.1",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
stickers = "stickersplit.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
