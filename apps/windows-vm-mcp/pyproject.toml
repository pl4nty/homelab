[project]
name = "windows-vm-mcp"
version = "0.1.0"
description = "Namespace devbox-style MCP tools for Azure Windows VMs, with GUI tools"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
windows-vm-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "hub.py", "arm.py", "agent/"]
