[project]
name = "mcp-servers"
version = "0.1.0"
description = "Remote MCP servers for Microsoft 365 via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # uvx --from git+... ignores uv.lock, so an unbounded range resolves to latest at every startup.
    "mcp[cli]==2.3.0",
    # "msgraph-beta-sdk>=1.0.0",
    # "azure-identity>=1.19.0",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
    "google-maps-routing==0.11.2",
]

[project.scripts]
mcp-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "tools/"]
