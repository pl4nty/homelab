// https://github.com/JPro-one/HelloJPro/blob/main/build.gradle
buildscript {
  repositories {
    gradlePluginPortal()

    maven {
      url = "https://sandec.jfrog.io/artifactory/repo"
    }
  }

  dependencies {
    classpath 'one.jpro:jpro-gradle-plugin:2026.4.0'
  }
}

plugins {
  // javafxplugin 0.1.0 no longer applies the java plugin, and sourceSets below needs it first
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
}

apply plugin: 'jpro-gradle-plugin'

sourceSets {
  main {
    java {
      srcDir 'src'
    }
    resources {
      srcDir 'src'
    }
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
}

// compile only: jpro bundles its own JavaFX build (27-jpro), which needs Java 25 at runtime
javafx {
  version = '17.0.7'
  modules = [ 'javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.media', 'javafx.swing', 'javafx.web' ]
}

application {
  mainClass = 'comp1110.ass1.gui.Game'
}

jpro {
  JVMArgs << '-Xmx1000m'

  // jpro server port
  port = 8080
}
