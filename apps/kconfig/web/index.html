<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Kconfig</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🐧</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Kconfig</h1>
      <select id="tree" aria-label="Kernel tree"></select>
      <select id="arch" aria-label="Architecture"></select>
      <span id="status" role="status"></span>
    </header>
    <div id="toolbar">
      <label>Start from <select id="base"></select></label>
      <label>Add fragment <select id="fragment"></select></label>
      <label class="file">Load .config <input id="upload" type="file" /></label>
      <span class="spacer"></span>
      <button id="reset" type="button">Reset</button>
      <button id="save-defconfig" type="button">defconfig</button>
      <button id="save-config" type="button" class="primary">.config</button>
    </div>
    <main>
      <nav>
        <input id="search" type="search" placeholder="Search symbols, prompts and help" autocomplete="off" spellcheck="false" />
        <label class="check"><input id="changed" type="checkbox" /> Changed by you <span id="changed-count"></span></label>
        <ul id="results"></ul>
      </nav>
      <section id="detail"></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
